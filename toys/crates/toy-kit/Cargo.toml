[package]
name = "toy-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "What every toy stands on: the GPU, the data, the real globe by day and night, a sound out, the device's C ABI and the headless check."

[dependencies]
wgpu = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(all(not(target_os = "ios"), not(target_arch = "wasm32")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "metal", "counters"] }
