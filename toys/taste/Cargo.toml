bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "taste-check"
path = "src/bin/check.rs"

[[bin]]
name = "taste-taster"
path = "src/bin/taster.rs"

[lints]
workspace = true
