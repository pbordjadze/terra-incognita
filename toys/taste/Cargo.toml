[package]
name = "taste"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Taste (a working title): a small creature that keeps changing, and lingers where you hold it: a Metropolis walk whose target is your attention (painting-company row 225)."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
toy-kit = { workspace = true }
