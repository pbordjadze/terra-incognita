# The toys: each its own app (toys/README.md). toy-kit is what they share; each toy is one crate.
[workspace]
resolver = "2"
members = ["crates/toy-kit", "whales", "murmuration", "mold", "fireflies", "bell", "swell", "carol", "terra", "jam", "meander", "frost", "taste", "walk", "screw", "throats", "bats", "huddle", "wave", "elkmont", "kanto", "nazare", "catatumbo", "bubblers", "barchans", "moonroad"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.clippy]
# numeric loops here index several arrays in step (a field, its neighbours, its output); an index is clearer
needless_range_loop = "allow"

[workspace.dependencies]
toy-kit = { path = "crates/toy-kit" }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
