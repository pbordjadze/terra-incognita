[package]
name = "terra"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Terra Incognita: the whole Earth, and on it the toys, each a living light where it is real (painting-company row 217)."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
# `hosted`: the toys below are linked into this one library, so only Terra's C ABI is exported
toy-kit = { workspace = true, features = ["hosted"] }
wgpu = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
whales = { path = "../whales" }
murmuration = { path = "../murmuration" }
mold = { path = "../mold" }
fireflies = { path = "../fireflies" }
bell = { path = "../bell" }
swell = { path = "../swell" }
meander = { path = "../meander" }
frost = { path = "../frost" }
catatumbo = { path = "../catatumbo" }
bubblers = { path = "../bubblers" }
barchans = { path = "../barchans" }
throats = { path = "../throats" }
bats = { path = "../bats" }
huddle = { path = "../huddle" }
wave = { path = "../wave" }

[[bin]]
name = "terra-check"
path = "src/bin/check.rs"

[lints]
workspace = true
