[package]
name = "meander"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Meander (a working title): a river on the Rio Beni's floodplain that wanders by the Howard-Knutson model and leaves oxbow lakes; a finger lays its course."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
toy-kit = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "meander-check"
path = "src/bin/check.rs"

[[bin]]
name = "meander-probe"
path = "src/bin/probe.rs"

[lints]
workspace = true
