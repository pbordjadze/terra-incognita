<!doctype html>
<!-- Terra on the web: the web's frame, as toys/ios/Sources/main.swift is the iPhone's, in HTML over a WebGPU
     canvas (toys/terra-web/src/lib.rs: the one frame core). It reads the chrome as data (toy-kit's chrome.rs)
     and draws it here, and sends back what the reader did. Built by tools/toys/web_build.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Terra Incognita</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { --glass: rgba(15, 15, 15, 0.62); --font: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .glass { position: fixed; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4); opacity: 0; transition: opacity .25s; font-family: var(--font); color: rgba(255,255,255,.95); }
  .glass.on { opacity: 1; }
  #caption { pointer-events: none; border-radius: 14px; padding: 8px 14px; font-size: 16px; line-height: 1.3;
    text-align: center; white-space: pre-line; transition-duration: .35s; max-width: min(calc(100vw - 48px), 560px); box-sizing: border-box; }
  #card { border-radius: 16px; padding: 14px 16px; box-sizing: border-box; overflow-y: auto; display: none; }
  #card p { margin: 0 0 7px; font-size: 16px; line-height: 1.35; }
  #card p.note { font-size: 13px; color: rgba(255,255,255,.64); margin: 6px 0 0; }
  #card .sw { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 38px; font-size: 16px; }
  #card .sw.off span { opacity: .55; }
  #card .sw input { appearance: none; -webkit-appearance: none; margin: 0; width: 51px; height: 31px; border-radius: 16px;
    background: rgba(120,120,128,.32); position: relative; transition: background .2s; cursor: pointer; flex: none; }
  #card .sw input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  #card .sw input:checked { background: #34c759; }
  #card .sw input:checked::after { transform: translateX(20px); }
  #card .more { border-top: 1px solid rgba(255,255,255,.16); margin-top: 6px; padding-top: 6px; display: flex; flex-wrap: wrap; column-gap: 24px; }
  #card .more button { background: none; border: 0; padding: 0; min-height: 34px; font: 16px var(--font); color: #7dbfff; cursor: pointer; }
  #label { position: fixed; pointer-events: none; font-family: var(--font); opacity: 0; }
  #label .h { font-size: 20px; font-weight: 600; line-height: 1.3; }
  #label .s { font-size: 15px; line-height: 1.35; }
  #title { position: fixed; left: 48px; right: 48px; text-align: center; font: 13px var(--font); color: rgba(255,255,255,.55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; opacity: 0; transition: opacity .6s; }
  #loading { position: fixed; left: 50%; top: 50%; width: 120px; height: 2px; margin: -1px 0 0 -60px; background: rgba(255,255,255,.12);
    border-radius: 1px; overflow: hidden; transition: opacity .6s; }
  #loading div { height: 100%; width: 0; background: rgba(255,255,255,.7); transition: width .2s; }
  #status { position: fixed; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); text-align: center;
    font: 16px/1.45 var(--font); color: rgba(255,255,255,.75); display: none; }
  #marks { position: fixed; inset: 0; pointer-events: none; }
  #marks button { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="terra"></canvas>
<div id="safe"></div>
<div id="marks" role="group"></div>
<div id="title" aria-live="polite"></div>
<div id="caption" class="glass" role="status" aria-live="polite"></div>
<div id="card" class="glass" role="dialog"></div>
<div id="label"></div>
<div id="loading"><div></div></div>
<div id="status" role="alert"></div>
<script type="module">
import init, { start } from './terra_web.js';

const $ = id => document.getElementById(id);
const canvas = $('terra');
const say = text => { $('loading').style.opacity = 0; const s = $('status'); s.textContent = text; s.style.display = 'block'; };
// (the site's other pages share this page's storage: a key of Terra's own)
const KEY = 'terra-incognita:state';
let shell = null;

function size() {
  const dpr = window.devicePixelRatio || 1, r = canvas.getBoundingClientRect();
  return [Math.max(1, Math.round(r.width * dpr)), Math.max(1, Math.round(r.height * dpr)), dpr, r.width, r.height];
}
function safe() {
  const s = getComputedStyle($('safe'));
  return { top: parseFloat(s.paddingTop) || 0, bottom: parseFloat(s.paddingBottom) || 0 };
}

async function load() {
  const index = await (await fetch('data/index.json')).json();
  const total = Object.values(index).reduce((a, b) => a + b, 0);
  let got = 0;
  const bar = $('loading').firstElementChild;
  const names = Object.keys(index);
  const files = await Promise.all(names.map(async name => {
    const resp = await fetch('data/' + name);
    if (!resp.ok) throw new Error(name + ': ' + resp.status);
    const reader = resp.body.getReader(), parts = [];
    let n = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); n += value.length; got += value.length;
      bar.style.width = (100 * got / total).toFixed(1) + '%';
    }
    const out = new Uint8Array(n);
    let at = 0;
    for (const p of parts) { out.set(p, at); at += p.length; }
    return out;
  }));
  return [names, files];
}

async function main() {
  // WebGPU, or WebGL2 where the browser has none (asked of a spare canvas: Terra's takes one context only)
  if (!navigator.gpu && !document.createElement('canvas').getContext('webgl2')) { say('Terra needs WebGPU or WebGL2: a current Safari, Chrome, Edge, Firefox or Opera.'); return; }
  await init();
  const [names, files] = await load();
  const [w, h, dpr] = size();
  canvas.width = w; canvas.height = h;
  const dark = matchMedia('(prefers-color-scheme: dark)'), still = matchMedia('(prefers-reduced-motion: reduce)');
  shell = await start(canvas, w, h, dpr, names, files, Date.now() / 1000, dark.matches, still.matches);
  // (a page can't tell whether a screen reader runs: the lights come as buttons always)
  shell.send(JSON.stringify({ reader: { on: true } }));
  try { const s = localStorage.getItem(KEY); if (s) shell.restore(s); } catch (e) { /* no storage: start fresh */ }
  // a link's #<toy id> (e.g. #bats) opens that toy a second in, as a touch on its light would
  let link = location.hash.slice(1);
  try { link = decodeURIComponent(link); } catch (_) { /* a malformed escape: the hash as it is */ }
  if (link && !shell.open_toy(link)) console.log(`no toy "${link}" in Terra`);
  dark.addEventListener('change', e => shell.set_night(e.matches));
  still.addEventListener('change', e => shell.set_reduce_motion(e.matches));
  $('loading').style.opacity = 0;
  wire();
  requestAnimationFrame(tick);
}

// ---- touches (the canvas's; the sheet keeps its own) and the sound, which starts with the first touch
function wire() {
  const phases = { pointerdown: 0, pointermove: 1, pointerup: 2, pointercancel: 3 };
  for (const [name, phase] of Object.entries(phases)) {
    canvas.addEventListener(name, e => {
      const r = canvas.getBoundingClientRect();
      if (phase === 0) { try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* gone already */ } startSound(); }
      if (phase === 2) askMotion();
      e.preventDefault();
      shell.pointer(e.pointerId >>> 0, phase, e.clientX - r.left, e.clientY - r.top, performance.now() / 1000);
    });
  }
  // a mouse's wheel is a pinch about the pointer, as a trackpad's pinch (ctrlKey) is in every browser
  canvas.addEventListener('wheel', e => { e.preventDefault(); wheel(e); }, { passive: false });
  for (const g of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(g, e => e.preventDefault());
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  const keep = () => { try { const s = shell.save(); if (s) localStorage.setItem(KEY, s); } catch (_) { /* no storage */ } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) { keep(); shell.pause(); if (audio) audio.suspend(); } else if (audio) audio.resume(); });
  addEventListener('pagehide', keep);
}

// two pretend fingers either side of the pointer, moved apart or together by the wheel, let go after a pause
let pinch = null;
const A = 4000000001, B = 4000000002;
function wheel(e) {
  const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, t = performance.now() / 1000;
  const k = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002));
  if (!pinch) {
    pinch = { x, y, d: 60 };
    shell.pointer(A, 0, x - 60, y, t); shell.pointer(B, 0, x + 60, y, t);
  }
  pinch.d = Math.min(Math.max(pinch.d * k, 4), 4000);
  shell.pointer(A, 1, pinch.x - pinch.d, pinch.y, t); shell.pointer(B, 1, pinch.x + pinch.d, pinch.y, t);
  clearTimeout(pinch.end);
  pinch.end = setTimeout(() => {
    const t2 = performance.now() / 1000;
    shell.pointer(A, 2, pinch.x - pinch.d, pinch.y, t2); shell.pointer(B, 2, pinch.x + pinch.d, pinch.y, t2);
    pinch = null;
  }, 180);
}

// ---- shakes: the device's own acceleration, in g, to the library, which tells a shake from a few hard jolts
// (toy-kit's shake.rs), from the first touch's lift: iPhone Safari asks the reader then (it may ask only
// from a touch); other browsers need no asking.
let moving = false, asked = false, gravity = null;
function askMotion() {
  if (asked || moving || !window.DeviceMotionEvent) return;
  asked = true;
  const ask = DeviceMotionEvent.requestPermission;
  if (typeof ask !== 'function') { listenMotion(); return; }
  ask.call(DeviceMotionEvent).then(r => { if (r === 'granted') listenMotion(); })
    .catch(() => { asked = false; /* not taken as a touch's: ask again at the next */ });
  // the compass, for the toys that follow north (iPhone Safari asks for it separately)
  const askO = window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission;
  if (typeof askO === 'function') askO.call(DeviceOrientationEvent).catch(() => {});
}
// What the phone feels (toy-kit's Sensors): which way is down, in g, in the device's frame (x right, y up the
// screen, z out of it: devicemotion's accelerationIncludingGravity is the push against gravity, so turned
// round), and the compass heading (iPhone Safari's webkitCompassHeading; elsewhere the absolute
// orientation's alpha, anticlockwise). A browser gives no magnetic field.
// Down is taken from the orientation's beta and gamma where there are any (their signs agree across
// browsers, where devicemotion's do not), and turned, with the heading, to the screen when it is turned.
let down = null, heading = NaN, tilted = false;
addEventListener('deviceorientation', e => {
  if (e.beta != null && e.gamma != null) {
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    down = [Math.cos(b) * Math.sin(g), -Math.sin(b), -Math.cos(b) * Math.cos(g)];
    tilted = true;
  }
  if (typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) heading = e.webkitCompassHeading;
  sense();
});
addEventListener('deviceorientationabsolute', e => {
  if (e.absolute && e.alpha != null) { heading = (360 - e.alpha) % 360; sense(); }
});
function turn() {
  const a = screen.orientation && typeof screen.orientation.angle === 'number' ? screen.orientation.angle : (window.orientation || 0);
  return a;
}
function sense() {
  if (shell && (down || !Number.isNaN(heading))) {
    const t = turn() * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
    const d = down || [NaN, NaN, NaN];
    const h = Number.isNaN(heading) ? NaN : (heading + turn() + 360) % 360;
    shell.sense(d[0] * c - d[1] * s, d[0] * s + d[1] * c, d[2], h);
  }
}
function listenMotion() {
  if (moving) return;
  moving = true;
  addEventListener('devicemotion', e => {
    if (!shell) return;
    const G = 9.81, t = performance.now() / 1000;
    let a = e.acceleration;
    if (!a || a.x == null) {
      // (no acceleration without gravity here: take a slow average of the one with it out)
      const g = e.accelerationIncludingGravity;
      if (!g || g.x == null) return;
      gravity = gravity ? gravity.map((v, i) => v + 0.1 * ([g.x, g.y, g.z][i] - v)) : [g.x, g.y, g.z];
      a = { x: g.x - gravity[0], y: g.y - gravity[1], z: g.z - gravity[2] };
    }
    shell.motion(a.x / G, a.y / G, (a.z ?? 0) / G, t);
    const g = e.accelerationIncludingGravity;
    if (!tilted && g && g.x != null) { down = [-g.x / G, -g.y / G, -(g.z ?? 0) / G]; sense(); }
  });
}

let audio = null;
function startSound() {
  if (audio) { if (audio.state !== 'running') audio.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio = new AC();
  const node = audio.createScriptProcessor(2048, 0, 2);
  let buf = new Float32Array(4096);
  node.onaudioprocess = e => {
    const out = e.outputBuffer, n = out.length;
    if (buf.length !== n * 2) buf = new Float32Array(n * 2);
    shell.audio(buf, audio.sampleRate);
    const l = out.getChannelData(0), r = out.getChannelData(1);
    for (let i = 0; i < n; i++) { l[i] = buf[2 * i]; r[i] = buf[2 * i + 1]; }
  };
  node.connect(audio.destination);
  audio.resume();
}

// ---- each frame: the picture, what Terra asks (haptics), then the chrome when it changed (toy-kit's chrome.rs)
function tick() {
  try { frame(); } catch (e) { console.error(e); say('Terra stopped here. ' + (e && e.message ? e.message : e)); return; }
  requestAnimationFrame(tick);
}
const now = () => performance.now() / 1000;
const send = m => shell.send(JSON.stringify(m));
// a haptic intent as a buzz's length (ms), where the browser can buzz at all
const BUZZ = { tick: 8, soft: 12, firm: 18, thud: 30 };
let chrome = null;
function frame() {
  const [w, h, dpr] = size();
  if (w !== canvas.width || h !== canvas.height) { canvas.width = w; canvas.height = h; shell.resize(w, h, dpr); layout(); }
  shell.frame(now(), Date.now() / 1000);
  const ev = shell.events();
  if (ev) for (const e of JSON.parse(ev)) if (e.event === 'haptic' && navigator.vibrate) navigator.vibrate(BUZZ[e.haptic] ?? 8);
  const c = shell.chrome();
  if (c === undefined || c === null) return;
  chrome = JSON.parse(c);
  showTitle(chrome.title ?? null);
  showCaption(chrome.caption ?? null);
  showCard(chrome.sheet ?? null);
  showLabel(chrome.label ?? null);
  marks();
}

let titleText = null;
function showTitle(text) {
  if (text === titleText) return;
  titleText = text;
  const el = $('title');
  if (text !== null) el.textContent = text;
  el.style.top = (safe().top + 14) + 'px';
  el.style.opacity = text === null ? 0 : 1;
}

// the info mark's line: as wide as it needs (two lines at most), its middle 74 points above the safe area's foot;
// a line too long for one breaks after its first sentence
let captionText = null;
function showCaption(text) {
  if (text === captionText) return;
  captionText = text;
  const el = $('caption');
  if (text === null) { el.classList.remove('on'); return; }
  el.textContent = text;
  el.style.left = '0'; el.style.top = '0';
  el.style.whiteSpace = 'nowrap'; el.style.maxWidth = 'none';
  const most = Math.min(innerWidth - 48, 560);
  if (el.scrollWidth > most && text.includes('. ')) el.textContent = text.replace('. ', '.\n');
  el.style.whiteSpace = 'pre-line'; el.style.maxWidth = '';
  const mid = innerHeight - safe().bottom - 74;
  el.style.left = ((innerWidth - el.offsetWidth) / 2) + 'px';
  el.style.top = (mid - el.offsetHeight / 2) + 'px';
  el.classList.add('on');
}

// the sheet: the rules (or the origins in their place), the style's credit, the switches a row each, a hairline and
// the buttons; at most 480 wide, centred, its foot 60 above the screen's, or hung from the top. A tap off it (the
// canvas's) closes it.
let card = null, cardKey = null;
function showCard(sheet) {
  const opening = card === null, el = $('card');
  if (sheet === null) {
    card = cardKey = null;
    el.classList.remove('on'); setTimeout(() => { if (card === null) el.style.display = 'none'; }, 300); return;
  }
  // (rebuilt when its words change; the switches' states are only set)
  const key = JSON.stringify([sheet.page, sheet.lines, sheet.note, sheet.style, sheet.demo, sheet.origins, sheet.switches.map(s => s.label)]);
  if (key !== cardKey) {
    el.replaceChildren();
    for (const line of sheet.lines) { const p = document.createElement('p'); p.textContent = line; el.append(p); }
    const notes = [...(sheet.note ? sheet.note.split('\n') : []), ...(sheet.style ? [sheet.style.credit] : [])];
    for (const line of notes) { const p = document.createElement('p'); p.className = 'note'; p.textContent = line; el.append(p); }
    const box = document.createElement('div'); box.className = 'sws'; el.append(box);
    sheet.switches.forEach((sw, i) => {
      const label = document.createElement('label'), span = document.createElement('span'), input = document.createElement('input');
      label.className = 'sw'; input.type = 'checkbox'; input.setAttribute('role', 'switch');
      input.addEventListener('change', () => send({ switch: { i, on: input.checked } }));
      span.textContent = sw.label;
      label.append(span, input); box.append(label);
    });
    const links = [];
    if (sheet.page === 'rules' && sheet.demo) links.push(['Show me', () => send({ demo: { t: now() } })]);
    if (sheet.page === 'rules' && sheet.origins) links.push(['Where this comes from', () => send('origins')]);
    if (links.length) {
      const row = document.createElement('div'); row.className = 'more';
      for (const [name, act] of links) {
        const b = document.createElement('button'); b.textContent = name; b.addEventListener('click', act); row.append(b);
      }
      el.append(row);
    }
    el.setAttribute('aria-label', [...sheet.lines, ...notes].join('. '));
    cardKey = key;
  }
  const box = el.querySelector('.sws');
  sheet.switches.forEach((sw, i) => {
    const label = box.children[i];
    label.className = sw.on ? 'sw' : 'sw off';
    label.lastChild.checked = sw.on;
  });
  card = sheet;
  el.style.display = 'block';
  layoutCard();
  if (opening) requestAnimationFrame(() => el.classList.add('on'));
}
function layoutCard() {
  const el = $('card');
  if (card === null) return;
  const w = Math.min(innerWidth - 32, 480), foot = innerHeight - 60, top = safe().top;
  el.style.width = w + 'px'; el.style.left = ((innerWidth - w) / 2) + 'px';
  el.style.maxHeight = (foot - top - 8) + 'px';
  el.style.height = 'auto';
  el.style.top = (card.top ? top + 8 : foot - el.offsetHeight) + 'px';
}

// words Terra places (its postcard): a box, an alpha and an ink, then a heading, a quieter line, plain lines
let labelWords = null;
function showLabel(label) {
  const el = $('label');
  if (label === null) { labelWords = null; el.style.opacity = 0; el.setAttribute('aria-hidden', 'true'); return; }
  const words = label.lines.join('\n');
  if (words !== labelWords) {
    el.replaceChildren(...label.lines.map((l, i) => {
      const d = document.createElement('div');
      d.className = i === 0 ? 'h' : 's'; d.textContent = l; d.style.opacity = [1, 0.6, 0.85][Math.min(i, 2)];
      return d;
    }));
    labelWords = words;
  }
  const [x, y, w] = label.at;
  el.style.color = label.dark ? '#1c1c1e' : '#fff';
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';
  el.style.opacity = label.alpha;
  el.setAttribute('aria-hidden', label.alpha > 0.5 ? 'false' : 'true');
}

function layout() { layoutCard(); const c = captionText; captionText = null; showCaption(c); }

// the marks and Terra's lights as buttons a screen reader can press (the picture draws them)
let marksKey = '';
function marks() {
  const list = chrome.buttons.map((b, i) => [b.label, b.at[0], b.at[1], () => send({ press: { i, t: now() } })]);
  if (chrome.mark.at) list.push(['About this', chrome.mark.at[0], chrome.mark.at[1], () => send({ mark: { t: now() } })]);
  const key = list.map(m => m[0] + Math.round(m[1] / 8) + ',' + Math.round(m[2] / 8)).join('|');
  if (key === marksKey) return;
  marksKey = key;
  const box = $('marks');
  box.replaceChildren(...list.map(([label, x, y, act]) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', label); b.style.left = x + 'px'; b.style.top = y + 'px';
    b.addEventListener('click', act);
    return b;
  }));
}

main().catch(e => { console.error(e); say('Terra could not start here. ' + (e && e.message ? e.message : e)); });
</script>
</body>
</html>
