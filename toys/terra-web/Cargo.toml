[package]
name = "terra-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Terra on the web: the same library as the iPhone's, behind the shell's calls (toy.h) as JavaScript ones, for web/index.html (tools/toys/web_build.sh)."

[lib]
crate-type = ["cdylib", "rlib"]

# wasm32's alone: on any other target this crate is empty
[target.'cfg(target_arch = "wasm32")'.dependencies]
terra = { path = "../terra" }
toy-kit = { workspace = true }
wgpu = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"

[lints]
workspace = true
