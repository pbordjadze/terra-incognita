[package]
name = "adrift-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Adrift's web shell: a canvas, WebGPU, pointer events."

[lib]
crate-type = ["cdylib"]

[dependencies]
adrift-core = { path = "../adrift-core" }
wgpu = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "PointerEvent", "Response", "Request", "Performance", "console", "CssStyleDeclaration", "KeyboardEvent", "WheelEvent", "DomRect", "Headers", "Storage", "MediaQueryList"] }
console_error_panic_hook = "0.1"
anyhow = { workspace = true }
serde_json = { workspace = true }
