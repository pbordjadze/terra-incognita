<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Terra Incognita</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root {
  color-scheme: dark;
  --ink: #07090e; --vellum: #eadfc2; --vellum-dim: #b3a88f; --gold: #e3bf5e; --gold-hi: #f6d98a; --vermilion: #e2553f; --lapis: #9db9ff;
  --rule: rgba(227, 191, 94, 0.32); --panel: rgba(9, 11, 17, 0.86);
  --display: "IM Fell English SC", Georgia, serif; --italic: "IM Fell English", Georgia, serif; --body: "EB Garamond", Georgia, serif;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--vellum); overflow: hidden; font-family: var(--body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: italic 18px/1.4 var(--italic); color: var(--vellum-dim); }

/* the caption: a line of a manuscript's rubric, set over a soft scrim at the foot of the screen */
#capWrap { position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 3;
  padding: 72px max(20px, var(--safe-r)) calc(46px + var(--safe-b)) max(20px, var(--safe-l));
  background: linear-gradient(to top, rgba(5, 7, 11, 0.78) 0%, rgba(5, 7, 11, 0.5) 55%, rgba(5, 7, 11, 0) 100%);
  opacity: 0; transition: opacity 0.6s ease; }
body.capOn #capWrap { opacity: 1; }
#cap { max-width: 34rem; margin: 0 auto; opacity: 0; transform: translateY(8px); transition: opacity 0.55s ease, transform 0.7s cubic-bezier(.2, .8, .2, 1); }
#cap.on { opacity: 1; transform: none; }
#capEyebrow { font: 400 12px/1 var(--display); letter-spacing: 0.24em; text-transform: uppercase; color: var(--vermilion); }
#capTitle { font: 400 26px/1.12 var(--italic); color: var(--gold-hi); margin: 7px 0 4px; text-wrap: balance; }
#capText { font: 400 17px/1.42 var(--body); color: var(--vellum); margin: 6px 0 0; text-wrap: pretty; }
#cap.big { text-align: center; }
#cap.big #capTitle { font: 400 clamp(34px, 9vw, 54px)/1.05 var(--display); letter-spacing: 0.12em; color: var(--gold-hi); margin: 10px 0 6px; }
#cap.big #capText { font: italic 400 19px/1.4 var(--italic); color: var(--vellum); }

/* the chapter, small at the top; the film's progress, a thread at the foot */
#chap { position: fixed; top: calc(14px + var(--safe-t)); left: max(18px, var(--safe-l)); z-index: 3; pointer-events: none;
  font: 400 12px/1 var(--display); letter-spacing: 0.22em; color: var(--gold); opacity: 0.85; text-shadow: 0 0 8px var(--ink); }
#bar { position: fixed; left: max(18px, var(--safe-l)); right: max(18px, var(--safe-r)); bottom: calc(18px + var(--safe-b)); height: 22px; z-index: 4; }
#bar::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 1px; background: var(--rule); }
#barFill { position: absolute; left: 0; right: 0; top: 10px; height: 1px; background: var(--gold); transform-origin: left; transform: scaleX(0); }
.tick { position: absolute; top: 3px; width: 15px; height: 15px; margin-left: -7.5px; border: 0; padding: 0; background: transparent; cursor: pointer; }
.tick::after { content: ""; position: absolute; left: 5px; top: 5px; width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold); opacity: 0.8; }

/* the reader has the map: resume, and the menu */
.pill { position: fixed; z-index: 5; border: 1px solid var(--rule); background: var(--panel); color: var(--gold-hi); cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#resume { left: 50%; transform: translateX(-50%); bottom: calc(52px + var(--safe-b)); padding: 12px 22px; border-radius: 999px;
  font: 400 15px/1 var(--display); letter-spacing: 0.16em; animation: rise 0.45s cubic-bezier(.2, .8, .2, 1); white-space: nowrap; }
#resume::before { content: "▸ "; color: var(--vermilion); }
#menuBtn { top: calc(8px + var(--safe-t)); right: max(12px, var(--safe-r)); width: 42px; height: 42px; border-radius: 50%; padding: 0;
  font: italic 400 21px/1 var(--italic); display: grid; place-items: center; }
body[data-mode="film"] #menuBtn { opacity: 0.55; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } }

.sheet { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--safe-b));
  width: min(460px, calc(100% - 24px - var(--safe-l) - var(--safe-r))); max-height: min(72vh, 640px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--rule); box-shadow: 0 0 0 4px rgba(7, 9, 14, 0.55), 0 18px 60px rgba(0, 0, 0, 0.6);
  padding: 20px 20px 16px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.sheet.rise { animation: rise 0.45s cubic-bezier(.2, .8, .2, 1); }
.sheet .eyebrow { font: 400 12px/1 var(--display); letter-spacing: 0.22em; text-transform: uppercase; color: var(--vermilion); }
.sheet h2 { font: 400 26px/1.12 var(--italic); color: var(--gold-hi); margin: 8px 0 10px; text-wrap: balance; }
.sheet p { font-size: 17px; line-height: 1.45; margin: 0 0 10px; }
.x { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border: 0; background: none; color: var(--vellum-dim); font: 400 26px/1 var(--body); cursor: pointer; }
#cardSource { font: italic 14px/1.35 var(--body); color: var(--vellum-dim); margin-top: 10px; }
#cardLink { display: inline-block; margin-top: 10px; font: 400 14px/1 var(--display); letter-spacing: 0.14em; color: var(--lapis); text-decoration: none; border-bottom: 1px solid rgba(157, 185, 255, 0.4); padding-bottom: 3px; }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; margin: 10px 0; }
.row > span { font: italic 16px/1.1 var(--italic); color: var(--vellum-dim); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 400 13px/1 var(--display); letter-spacing: 0.1em; color: var(--vellum-dim); background: transparent; border: 1px solid var(--rule); padding: 10px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--ink); background: var(--gold); border-color: var(--gold); }
.note { font: italic 14px/1.4 var(--body); color: var(--vellum-dim); margin: 12px 0 0; }
@media (prefers-reduced-motion: reduce) { #cap, #capWrap, .sheet.rise, #resume { transition: none; animation: none; } }
</style>
</head>
<body data-mode="film">
<div id="stage" aria-label="A world map drawn in characters. The tour plays by itself; touch the map to take it in hand."><canvas id="gl"></canvas><canvas id="text"></canvas></div>
<div id="chap" aria-live="polite"></div>
<div id="capWrap"><div id="cap" aria-live="polite"><div id="capEyebrow"></div><div id="capTitle"></div><p id="capText"></p></div></div>
<div id="bar"><div id="barFill"></div></div>
<button class="pill" id="resume" type="button" hidden>Resume the tour</button>
<button class="pill" id="menuBtn" type="button" aria-label="Styles">❦</button>

<section class="sheet" id="panel" hidden aria-labelledby="panelTitle">
  <button type="button" class="x" id="panelClose" aria-label="Close">&times;</button>
  <div class="eyebrow">Try the paths</div>
  <h2 id="panelTitle">The map’s styles</h2>
  <div class="row"><span>Ink</span><div class="seg">
    <button type="button" data-k="ink" data-v="night">Night</button><button type="button" data-k="ink" data-v="vellum">Vellum</button>
    <button type="button" data-k="ink" data-v="illum">Illuminated</button><button type="button" data-k="ink" data-v="kells">Kells</button></div></div>
  <div class="row"><span>Hibernia</span><div class="seg">
    <button type="button" data-k="kellsRoundel" data-v="off">Plain</button><button type="button" data-k="kellsRoundel" data-v="on">Kells medallion</button></div></div>
  <div class="row"><span>Mountains</span><div class="seg">
    <button type="button" data-k="relief" data-v="0">Little hills</button><button type="button" data-k="relief" data-v="1">Relief</button></div></div>
  <div class="row"><span>World</span><div class="seg">
    <button type="button" data-k="proj" data-v="0">Hemispheres</button><button type="button" data-k="proj" data-v="1">Oval</button><button type="button" data-k="proj" data-v="2">Globe</button></div></div>
  <div class="row"><span>Grain</span><div class="seg">
    <button type="button" data-k="grain" data-v="coarse">Coarse</button><button type="button" data-k="grain" data-v="fine">Fine</button><button type="button" data-k="grain" data-v="finest">Finest</button></div></div>
  <div class="row"><span>Night</span><div class="seg">
    <button type="button" data-k="sun" data-v="off">Off</button><button type="button" data-k="sun" data-v="on">As it is now</button></div></div>
  <p class="note">Ireland’s medallion and the Kells ink are the two paths for the Book of Kells. Tap what glints on the map to read about it.</p>
</section>

<section class="sheet" id="card" hidden aria-live="polite">
  <button type="button" class="x" id="cardClose" aria-label="Close">&times;</button>
  <div class="eyebrow" id="cardEyebrow"></div>
  <h2 id="cardTitle"></h2>
  <div id="cardBody"></div>
  <p id="cardSource"></p>
  <a id="cardLink" href="https://en.wikipedia.org/" target="_blank" rel="noopener">Read on Wikipedia</a>
</section>

<div id="fail" hidden></div>
<script>
  // in the app, links leave for Safari (App/TerraIncognita/MapView.swift); a browser opens a tab
  if (location.protocol === 'terra:') document.addEventListener('DOMContentLoaded', () => document.getElementById('cardLink').removeAttribute('target'));
  // Start-up, step by step and timed: to the app's log (and to the line it shows if starting
  // stalls), and to the console. TI.diag leaves a part out to find what stalls: `no2d` the
  // lettering canvas and pixel read-backs, `nogl` the map's drawing (Debug builds: -diag <mode>).
  window.TI = { diag: window.TI_DIAG || new URLSearchParams(location.search).get('diag') || '' };
  TI.log = msg => {
    const line = (performance.now() / 1000).toFixed(2) + ' s ' + msg;
    try { webkit.messageHandlers.page.postMessage(line); } catch (e) {}
    console.log('[terra] ' + line);
  };
  addEventListener('error', e => TI.log('error: ' + e.message + ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')'));
  addEventListener('unhandledrejection', e => TI.log('rejected: ' + (e.reason && e.reason.message || e.reason)));
  TI.log('page ' + innerWidth + 'x' + innerHeight + ' @' + devicePixelRatio + (TI.diag ? ', leaving out ' + TI.diag : ''));
</script>
<script src="render.js"></script>
<script src="scene.js"></script>
<script src="tour.js"></script>
<script src="main.js"></script>
</body>
</html>
