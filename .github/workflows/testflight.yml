name: TestFlight

# Terra Incognita (the toy that holds the toys, toys/terra) for TestFlight's internal testers, no Beta App
# Review (painting-company row 312). Paint by Moonlight's pipeline (pbordjadze/paint-by-number,
# .github/workflows/testflight.yml) on Terra's own build, which has no Xcode project:
#   build    toys/ios/build.sh with STORE=1: the same app the SideStore IPA is (toys.yml), its icon in an
#            asset catalog and the SDK's keys in Info.plist as App Store Connect wants them, unsigned;
#            tools/toys/check_store.sh holds it to what an upload needs.
#   sign     the app laid in an .xcarchive and exported by `xcodebuild -exportArchive` with Xcode's cloud
#            signing and the App Store Connect API key (the team's cloud-managed distribution certificate
#            and an App Store profile made on the spot: no certificate or profile in the secrets); the
#            App ID is registered first if it isn't (tools/toys/testflight.py register).
#   validate App Store Connect's own checks of the IPA, without uploading.
#   upload   only from `main`, only from Actions › TestFlight › Run workflow with "Upload" ticked; then
#            `testers` waits for processing and gives the build to the internal group "Team" (every App
#            Store Connect user of the team) with its What to Test (tools/toys/testflight.py testers).
# A push to a `claude/testflight*` branch runs the build and, once the secrets are set, signs and
# validates (ci.yml ignores those branches). macOS runners are shared with every app: one run at a time.
# Secrets (the same values as Paint by Moonlight's): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8
# file's text), APPLE_TEAM_ID. The key needs the Admin role (cloud signing and making profiles ask for it).
# The version is 1.0, the build <run>.<attempt>: every run, and every re-run of one, uploads a build
# number App Store Connect hasn't seen. External testers (a Beta App Review) are a later, separate step.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight for the internal testers (otherwise build, sign and validate only)'
        type: boolean
        default: false
      what_to_test:
        description: 'What to Test, shown to testers (empty: the standing text)'
        required: false
  push:
    branches: ['claude/testflight*']
    paths: ['toys/**', 'tools/toys/**', '.github/workflows/testflight.yml', 'ci/xcode.sh', 'ci/rust.sh', 'rust-toolchain.toml']

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  TOY: terra
  EXEC: Terra
  VERSION: '1.0'

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  upload:
    name: Build, sign and upload to TestFlight
    needs: [lint]
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      # The uploaded build, for `testers` (kept when a failed `testers` alone is re-run).
      build: ${{ steps.upload.outputs.build }}
    env:
      BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload && 'true' || 'false' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: From main only
        # Upload sends App Store Connect and the testers what this run checked out: only main's reviewed
        # code goes.
        if: github.event_name == 'workflow_dispatch' && inputs.upload && github.ref_name != 'main'
        run: |
          echo "::error::Upload runs from main only, and this run is on $GITHUB_REF_NAME: run it again from main, or without Upload"
          exit 1
      - uses: actions/checkout@v7
      - name: Xcode (the one version, ci/xcode.sh)
        run: bash ci/xcode.sh
      - name: Rust (the version rust-toolchain.toml names)
        run: bash ci/rust.sh aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: toys, key: 'ios-terra' }
      - name: Build the app as the App Store wants it
        run: |
          set -o pipefail
          mkdir -p out
          STORE=1 VERSION="$VERSION" BUILD_NUMBER="$BUILD" bash toys/ios/build.sh "$TOY" build/store 2>&1 | tee out/build.log | tail -40
          bash tools/toys/check_store.sh "build/store/Payload/$EXEC.app" 2>&1 | tee out/store-check.log
      - name: API key
        id: key
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_KEY_P8; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            if [ "$UPLOAD" = true ]; then echo "::error::Secrets not set:$missing (Settings › Secrets and variables › Actions)"; exit 1; fi
            echo "::warning::Secrets not set:$missing, so this run built and checked the app but couldn't sign or validate it"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Rebuilt from its base64 alone: a key copied on a phone can lose its line breaks or gain spaces.
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          BODY=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\r\n')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2> /dev/null; then
            echo "::error::ASC_KEY_P8 isn't a private key: paste the whole .p8 file, BEGIN and END lines included"; exit 1
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: App ID and app record
        if: steps.key.outputs.ready == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/venv/bin/python" tools/toys/testflight.py register
      - name: Sign
        # The unsigned app laid in an archive as Xcode lays one, then exported: cloud signing happens here,
        # into an IPA that the next steps validate and upload. (Xcode's own upload asks App Store Connect
        # for a store configuration that refuses the team key's JWT; altool accepts the same key.)
        if: steps.key.outputs.ready == 'true'
        run: |
          set -o pipefail
          ARCHIVE="build/$EXEC.xcarchive"
          rm -rf "$ARCHIVE"; mkdir -p "$ARCHIVE/Products/Applications" "$ARCHIVE/dSYMs"
          cp -R "build/store/Payload/$EXEC.app" "$ARCHIVE/Products/Applications/"
          APP_PLIST="$ARCHIVE/Products/Applications/$EXEC.app/Info.plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print $1" "$APP_PLIST"; }
          cat > "$ARCHIVE/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>ApplicationProperties</key>
            <dict>
              <key>ApplicationPath</key><string>Applications/$EXEC.app</string>
              <key>Architectures</key><array><string>arm64</string></array>
              <key>CFBundleIdentifier</key><string>$(read_key CFBundleIdentifier)</string>
              <key>CFBundleShortVersionString</key><string>$(read_key CFBundleShortVersionString)</string>
              <key>CFBundleVersion</key><string>$(read_key CFBundleVersion)</string>
              <key>Team</key><string>$APPLE_TEAM_ID</string>
            </dict>
            <key>ArchiveVersion</key><integer>2</integer>
            <key>CreationDate</key><date>$(date -u +%Y-%m-%dT%H:%M:%SZ)</date>
            <key>Name</key><string>$EXEC</string>
            <key>SchemeName</key><string>$EXEC</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$ARCHIVE/Info.plist"
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><false/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee out/export.log | tail -80
          IPA=$(ls build/export/*.ipa)
          ls -l "$IPA"
          # what it was signed as (no secret in it: the team id and the profile's name)
          rm -rf build/signed && mkdir -p build/signed && (cd build/signed && unzip -q "../../$IPA")
          codesign -dv --entitlements - "build/signed/Payload/$EXEC.app" 2>&1 | grep -vE '^(CDHash|Hash|CandidateCDHash)' | tee out/signature.txt
      - name: Validate with App Store Connect
        # The checks an upload gets (signature, Info.plist, icons, entitlements), without uploading. Needs
        # the app record (App Store Connect › Apps › + › New App).
        if: steps.key.outputs.ready == 'true'
        run: |
          set -o pipefail
          mkdir -p ~/private_keys && cp "$ASC_KEY_PATH" ~/private_keys/
          xcrun altool --validate-app -f "$(ls build/export/*.ipa)" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee out/validate.log | tail -40
          grep -qiE 'No errors validating|successfully' out/validate.log
      - name: Upload
        id: upload
        if: steps.key.outputs.ready == 'true' && env.UPLOAD == 'true'
        run: |
          set -o pipefail
          xcrun altool --upload-app -f "$(ls build/export/*.ipa)" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee out/upload.log | tail -40
          grep -qiE 'No errors uploading|UPLOAD SUCCEEDED' out/upload.log
          echo "Uploaded build $BUILD: App Store Connect processes it (usually 5 to 30 minutes) before TestFlight offers it."
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: testflight, path: out, if-no-files-found: ignore }

  testers:
    name: Give the build to the internal testers
    needs: upload
    if: needs.upload.outputs.build != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Wait for processing, then the internal group and What to Test
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ needs.upload.outputs.build }}
          WAIT_MINUTES: '50'
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/venv/bin/python" tools/toys/testflight.py testers
