name: Packs

# The packs in Prototypes/ (docs/runtime3.md, docs/playground.md): checked on every push that touches
# them and, on main, published to this repository's `packs` branch, which the app reads through
# https://raw.githubusercontent.com/pbordjadze/terra-incognita/packs/catalog.json. Linux only; no
# macOS runner is used.
#   validate  every pack against the runtime-3 contract, the size limits and the offline boundary
#   check     node --check on the packs' and tools' JavaScript, and the tool's unit tests
#   pack      catalog.json, packs/<id>/r<rev>/ and open/<id>.html, kept as the `packs` artifact. Packed from
#             scratch (every pack revision 1): it shows what a pack looks like, not what is live
#   publish   main only, after the checks: the `packs` branch (an orphan, made the first time) is checked
#             out beside the repository; only packs whose contents changed get the next revision there,
#             and the result is committed and pushed with the workflow's own token (no secret is used).
#             `[no-publish]` in the commit message holds it back. Other branches validate and pack only.
# Publishes never overlap (each reads and then writes one catalog). The `packs` branch holds no workflow
# files, so pushing it starts nothing.

on:
  push:
    branches-ignore: ['sidestore', 'packs', 'ci-shots/**']
    paths: ['Prototypes/**', 'tools/playground/**', 'ci/remote_packs.sh', '.github/workflows/packs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no-publish]') && 'packs-publish' || format('packs-check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || contains(github.event.head_commit.message, '[no-publish]') }}

jobs:
  packs:
    name: Validate and pack the prototypes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Validate
        run: python3 tools/playground/playground.py validate
      - name: Syntax and unit tests
        run: |
          rc=0
          for f in $(find Prototypes tools/playground -name '*.js' -o -name '*.mjs' -o -name '*.cjs' | grep -v /node_modules/); do
            node --check "$f" || rc=1
          done
          python3 -m unittest tools/playground/test_playground.py || rc=1
          exit $rc
      - name: Pack
        run: python3 tools/playground/playground.py pack --out build/packs
      - uses: actions/upload-artifact@v5
        with: { name: packs, path: build/packs, if-no-files-found: error }

  publish:
    name: Publish to the packs branch
    needs: packs
    if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no-publish]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Publish
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          dir="$RUNNER_TEMP/packs-branch"
          message="$RUNNER_TEMP/packs-message"
          summary="$RUNNER_TEMP/packs-summary"

          # the packs branch as it is now, or a new orphan (no history shared with main) the first time
          checkout() {
            rm -rf "$dir"
            set +e
            git ls-remote --exit-code --heads "$remote" packs > /dev/null
            found=$?
            set -e
            case "$found" in
              0) git clone --quiet --depth 1 --branch packs --single-branch "$remote" "$dir" ;;
              2) git init --quiet -b packs "$dir" && git -C "$dir" remote add origin "$remote" ;;
              *) echo "::error::Could not read the packs branch (git ls-remote exited $found)"; exit 1 ;;
            esac
          }

          checkout
          for attempt in 1 2 3; do
            rm -f "$message" "$summary"
            python3 tools/playground/playground.py publish --into "$dir" \
              --public-url "https://raw.githubusercontent.com/${REPO}/packs" \
              --commit-message "$message" --summary "$summary"
            if [ ! -s "$message" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            printf '\nFrom %s on main.\n' "$SOURCE" >> "$message"
            git -C "$dir" add -A
            git -C "$dir" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -F "$message"
            if git -C "$dir" push --quiet origin HEAD:refs/heads/packs; then
              head -n 1 "$message"
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "The packs branch moved while publishing (attempt $attempt); starting again from it."
            checkout
          done
          echo "::error::Could not push the packs branch after 3 attempts"
          exit 1

  globe-packs:
    name: The globe-drawn packs' data tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: The station parser
        run: node tools/playground/sounding-the-deep/fetch-stations.cjs --self-test
