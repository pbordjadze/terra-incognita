name: Prune merged branches

# One-off, run by hand: deletes every remote branch already merged into main, except main, sidestore,
# packs, the before-* archives and any branch with an open pull request. Removed again once it has run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the branches without deleting them
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete the merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          open=$(gh pr list --state open --limit 200 --json headRefName --jq '.[].headRefName')
          git branch -r --merged origin/main --format='%(refname:lstrip=3)' | while read -r b; do
            case "$b" in main|HEAD|sidestore|packs|before-*) continue ;; esac
            if grep -qxF "$b" <<< "$open"; then echo "keep $b (open pull request)"; continue; fi
            if [ "$DRY_RUN" = true ]; then echo "would delete $b"; else git push origin --delete "$b"; fi
          done
