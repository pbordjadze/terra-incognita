name: Toys

# The toys (toys/README.md): each its own app beside Terra and Adrift in the same SideStore source.
#   plan    which toys this push touches (tools/toys/ci_plan.py).
#   check   Linux, a toy at a time: built, tested, every plan in toys/<toy>/plans played headless on Mesa's
#           software Vulkan; the shots, films (MP4 and contact sheet) and sound are the `<toy>-check`
#           artifact: look at them.
#   ipa     macOS (the five runners are shared with every app: one build a toy a round): on main for a
#           toy whose own directory changed, on a branch when the commit's first line says
#           `[toys-ipa <toy>]`; then opened in the iOS Simulator with Metal's validation on
#           (tools/toys/sim_launch.sh), failing if it closes. On main it is released as `<toy>-build-<n>` (the five newest kept);
#           on a branch it is the `<toy>-ipa` artifact.
#   publish on main after a release: the SideStore source regenerated with every app (ci/sidestore_publish.sh).

on:
  push:
    branches-ignore: ['ci-shots/**', 'sidestore', 'packs']
    paths: ['toys/**', 'tools/toys/**', 'tools/kit/**', '.github/workflows/toys.yml', 'ci/xcode.sh']
  workflow_dispatch:
    inputs:
      toy:
        description: The toy (empty for all)
        type: string
        default: ''
      ipa:
        description: Build its IPA too (macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # a branch's newer push cancels its older run; on main every merge runs to the end (two toys' rounds
  # may merge a minute apart)
  group: toys-${{ github.ref_name == 'main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.plan.outputs.check }}
      ipa: ${{ steps.plan.outputs.ipa }}
      kit: ${{ steps.plan.outputs.kit }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false, fetch-depth: 0, filter: 'blob:none' }
      - id: plan
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 tools/toys/ci_plan.py "${{ github.event_name }}" "${{ github.ref_name }}" "${{ github.event.before }}" "${{ github.sha }}" "$MESSAGE" "${{ inputs.toy }}" "${{ inputs.ipa }}" | tee -a "$GITHUB_OUTPUT"

  check:
    needs: [plan]
    if: ${{ needs.plan.outputs.check != '[]' }}
    name: Check ${{ matrix.toy }} on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toy: ${{ fromJSON(needs.plan.outputs.check) }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: toys, key: '${{ matrix.toy }}' }
      - name: Software Vulkan, ffmpeg and the data
        run: |
          # (a fresh runner's own apt-daily / unattended-upgrades can hold the package lock for half an hour,
          # and a mirror can be slow: they are stopped, the lock waited on for a bounded time, the Vulkan driver
          # installed first and required, ffmpeg (only for the films) after it and not required)
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service unattended-upgrades 2> /dev/null || true
          APT="-o DPkg::Lock::Timeout=240 -o Acquire::http::Timeout=30 -o Acquire::Retries=3"
          for i in 1 2; do
            timeout 300 sudo apt-get update -qq $APT || true
            timeout 600 sudo apt-get install -y -qq --no-install-recommends $APT mesa-vulkan-drivers > /dev/null && break
            echo "::warning::apt attempt $i for the Vulkan driver failed or timed out"; sleep 10
          done
          ls /usr/share/vulkan/icd.d/lvp_icd*.json > /dev/null || { echo "::error::no software Vulkan (mesa-vulkan-drivers) installed"; exit 1; }
          timeout 600 sudo apt-get install -y -qq --no-install-recommends $APT ffmpeg > /dev/null || echo "::warning::no ffmpeg: the plans' films are kept as frames"
          python3 tools/toys/assets.py ${{ matrix.toy }} --link
      - name: Build and test
        working-directory: toys
        run: |
          cargo build --release -p ${{ matrix.toy }} --bin ${{ matrix.toy }}-check
          cargo test --release -p toy-kit -p ${{ matrix.toy }}
          # Terra holds the others: its data is theirs, merged (tools/toys/terra/manifest.py)
          if [ "${{ matrix.toy }}" = terra ]; then python3 ../tools/toys/terra/manifest.py --check; fi
          cargo clippy --release -p ${{ matrix.toy }} -- -D warnings || echo "::warning::clippy has findings"
      - name: Launch check (every shader translated to Metal as on the iPhone)
        run: |
          command -v naga > /dev/null || cargo install -q naga-cli --version 26.0.0 --locked
          bash tools/toys/launch_check.sh ${{ matrix.toy }}
      - name: Play every plan
        working-directory: toys
        # every touch in a plan must do something visible (warned, not failed, unless a plan is strict)
        env: { KIT_TAP_CHECK: '1' }
        run: |
          mkdir -p build/out
          for p in ${{ matrix.toy }}/plans/*.json; do
            n=$(basename "$p" .json)
            cargo run -q --release -p ${{ matrix.toy }} --bin ${{ matrix.toy }}-check -- play "$p" "build/out/$n" | tee "build/out/$n.log"
            if [ -d "build/out/$n/film" ] && command -v ffmpeg > /dev/null; then bash ../tools/toys/film.sh "build/out/$n" && rm -rf "build/out/$n/film"; fi
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: '${{ matrix.toy }}-check', path: toys/build/out, if-no-files-found: error }

  kit:
    # toy-kit as other repositories use it (docs/kit.md): without the globe, and the web shell for
    # wasm32. Only when toy-kit changed; nothing needs it, so it never holds a toy's check or release.
    needs: [plan]
    if: ${{ needs.plan.outputs.kit == 'true' }}
    name: toy-kit without the globe, and for the web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Build
        working-directory: toys
        run: |
          # the budget's test makes a device (Mesa's software Vulkan, as the check jobs)
          sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers > /dev/null
          rustup target add wasm32-unknown-unknown
          cargo build -p toy-kit --no-default-features
          cargo test -q -p toy-kit --no-default-features
          cargo check -p toy-kit --no-default-features --features web --target wasm32-unknown-unknown

  ipa:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.outputs.ipa != '[]' && needs.check.result == 'success' }}
    name: IPA for ${{ matrix.toy }} (unsigned device build)
    permissions:
      contents: write
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toy: ${{ fromJSON(needs.plan.outputs.ipa) }}
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Xcode (the one version, ci/xcode.sh)
        run: bash ci/xcode.sh
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-ios,aarch64-apple-ios-sim' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: toys, key: 'ios-${{ matrix.toy }}' }
      - name: Build the IPA
        run: |
          mkdir -p out
          BUILD="$BUILD" bash toys/ios/build.sh ${{ matrix.toy }} out 2>&1 | tee out/ipa-build.log | tail -40
          ls -l out/${{ matrix.toy }}.ipa
          bash tools/toys/launch_check.sh ${{ matrix.toy }} --ipa out/${{ matrix.toy }}.ipa
      - name: Open it in the Simulator (Apple's Metal compiler, Metal's validation on)
        run: |
          bash tools/toys/sim_launch.sh ${{ matrix.toy }} out/sim
          # a toy whose sim.env asks for it is opened on an iPad too (Terra: its passages at the iPad's size)
          if grep -q '^SIM_ALSO=iPad' toys/${{ matrix.toy }}/sim.env 2> /dev/null; then
            SIM_DEVICE=iPad bash tools/toys/sim_launch.sh ${{ matrix.toy }} out/sim-ipad
          fi
      - name: Release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          TOY: ${{ matrix.toy }}
        run: |
          TAG="$TOY-build-$BUILD"
          git log -1 --format=%s > out/notes.txt
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "out/$TOY.ipa" --clobber
          else
            gh release create "$TAG" "out/$TOY.ipa" --prerelease --target "$GITHUB_SHA" \
              --title "$(python3 -c "import json; print(json.load(open('toys/$TOY/toy.json'))['name'])") build $BUILD" --notes-file out/notes.txt
          fi
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep "^$TOY-build-[0-9]*$" | sort -t- -k3 -n -r | tail -n +6 |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: '${{ matrix.toy }}-ipa', path: out, if-no-files-found: error }

  publish:
    needs: [plan, ipa]
    if: ${{ !cancelled() && github.ref_name == 'main' && needs.plan.outputs.ipa != '[]' && needs.ipa.result != 'skipped' }}
    name: SideStore source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # one publish at a time; a newer one waiting replaces an older one waiting (it reads every release)
    concurrency: { group: toys-sidestore-source, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate and push the source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ci/sidestore_publish.sh build/source "SideStore source after toys build ${{ github.run_number }} (${{ join(fromJSON(needs.plan.outputs.ipa), ', ') }})"
