name: CI

# Every run publishes a report (STATUS.md, logs, screenshots) to the ref refs/ci-shots/<branch>,
# outside refs/heads so a clone never downloads it; ci/fetch.sh waits for it and unpacks it.
#   plates Linux: every look in Atlas/ and the globe's data in Globe/ sound (ci/check_atlas.py,
#          ci/check_globe.py), Wikipedia's words all bundled (ci/check_wikipedia.py), the tools' syntax,
#          and every Metal shader compiled as C++
#          (tools/metal/metal.py check: seconds, where a macOS build waits on a runner)
#   apple  macOS: Debug and Release builds, real encounter UI tests (including largest text),
#          and the plates checked byte for byte
#          in the bundle; screenshots only when the workflow is run by hand, as a report: on the
#          13" iPad Pro (the primary device), the iPhone or both, every look at moments of its film
#          (unless `film` is off) and the globe in each style
#   ipa    after green `plates` and `apple` jobs, on main (or `[ipa]` in a branch commit's message, without
#          publishing): an unsigned Release IPA, published as the `build-<n>` prerelease (the five
#          newest are kept), and the SideStore source on the `sidestore` branch, which SideStore
#          reads at https://raw.githubusercontent.com/pbordjadze/terra-incognita/sidestore/source.json
# Commit-message tags on branches: `[build-only]` compiles without simulator time (about 3 minutes);
# `[shots]` (or `[shots name:lon,lat,zoom ...]`) photographs the stage at rest at places on the iPad,
# with no Release build and no UI tests (about 8 minutes); `[test Class ...]` runs only those UI test
# classes (or Class/testMethod) on the iPad; `[playground-check]` runs only the playground's checks;
# `[ipa]` packages a device build (main publishes it). ci/fast.py reads `[shots]` and `[test]`. Main
# ignores the narrowing tags: merge into it with a merge commit whose message carries none, as a
# fast-forward would bring a branch head's `[skip ci]` along.
# A push that changes only web packs (Prototypes/) skips this workflow: packs.yml handles it on Linux.
# The macOS runners (5 at once) are shared with pbordjadze/paint-by-number and pbordjadze/pigeon:
# one macOS job per push here.

on:
  push:
    branches-ignore: ['ci-shots/**', 'sidestore']
    # a web pack alone needs no native build: packs.yml (Linux) validates and publishes it
    paths-ignore: ['Prototypes/**', 'tools/playground/**', '.github/workflows/packs.yml']
  workflow_dispatch:
    inputs:
      device:
        description: Screenshots on
        type: choice
        options: [ipad, iphone, both]
        default: ipad
      leaf_only:
        description: Photograph only the atlas leaf
        type: boolean
        default: false
      interaction_suite:
        description: Branch interaction check (main always runs all tests)
        type: choice
        options: [all, leaf, whale, playground]
        default: all
      whale_capture:
        description: Capture the whale experience after interactions (report only)
        type: boolean
        default: false
      film:
        description: The films' moments too (off - the globe only)
        type: boolean
        default: true
      tests:
        description: Only these UI test classes or Class/testMethod, on the iPad (branch only; ci/fast.py)
        type: string
        default: ''
      places:
        description: Only the stage at these places, name:lon,lat,zoom (branch only; ci/fast.py)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  PROJECT: App/TerraIncognita.xcodeproj
  SCHEME: TerraIncognita

jobs:
  plates:
    name: The looks' plates, the globe's data and the tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Check Atlas and the plate tools
        run: |
          set -o pipefail
          mkdir -p out
          rc=0
          python3 ci/check_atlas.py 2>&1 | tee out/plates-check.log || rc=1
          python3 ci/check_globe.py 2>&1 | tee -a out/plates-check.log || rc=1
          python3 ci/check_wikipedia.py 2>&1 | tee -a out/plates-check.log || rc=1
          for f in tools/aegean/*.cjs; do
            node --check "$f" 2>&1 | tee -a out/plates-check.log || rc=1
          done
          # the playground's bundled packs and tools (docs/playground.md)
          python3 tools/playground/playground.py validate 2>&1 | tee -a out/plates-check.log || rc=1
          python3 tools/playground/test_playground.py 2>&1 | tail -3 | tee -a out/plates-check.log || rc=1
          for f in $(find Prototypes -name '*.js') tools/playground/*.cjs; do node --check "$f" 2>&1 | tee -a out/plates-check.log || rc=1; done
          for f in $(find tools/plates -name '*.js' -o -name '*.cjs' | grep -v -e /vendor/ -e /node_modules/); do
            node --check "$f" 2>&1 | tee -a out/plates-check.log || rc=1
          done
          for f in tools/ocean/*.cjs tools/ocean/web/*.js tools/clouds/*.cjs tools/clouds/web/*.js tools/metal/*.cjs; do node --check "$f" 2>&1 | tee -a out/plates-check.log || rc=1; done
          python3 -m py_compile tools/plates/*.py tools/globe/*.py tools/aegean/*.py tools/playground/*.py tools/ocean/*.py tools/clouds/*.py tools/metal/*.py tools/metal/tests/*.py tools/wikipedia/*.py ci/*.py 2>&1 | tee -a out/plates-check.log || rc=1
          # the Metal shaders compiled as C++ by clang, in seconds (tools/metal/README.md), and the
          # stand-in's own tests (numpy for its textures)
          python3 tools/metal/metal.py check 2>&1 | tee -a out/plates-check.log || rc=1
          python3 -m pip install --quiet --break-system-packages numpy > /dev/null 2>&1 || python3 -m pip install --quiet numpy > /dev/null 2>&1 || true
          python3 tools/metal/tests/test_metal.py 2>&1 | tail -3 | tee -a out/plates-check.log || rc=1
          exit $rc
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: plates, path: out, if-no-files-found: ignore }

  apple:
    name: Simulator builds and encounter interactions
    runs-on: macos-26
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: What this run checks
        # `[shots]` and `[test]` on a branch, or the hand-started run's places and tests (ci/fast.py)
        id: fast
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          TESTS: ${{ inputs.tests }}
          PLACES: ${{ inputs.places }}
        run: |
          set -o pipefail
          python3 ci/fast.py | tee -a "$GITHUB_OUTPUT"
      - name: Select simulators
        # Every push validates both devices sequentially; explicit manual selection remains; a fast
        # check (ci/fast.py) is the iPad's alone, the primary device.
        id: sim
        run: |
          D="${{ inputs.device }}"
          if [ "$D" = both ]; then
            D="ipad iphone"
          elif [ -z "$D" ] && [ -n "${{ steps.fast.outputs.fast }}" ]; then
            D="ipad"
          elif [ -z "$D" ]; then
            D="ipad iphone"
          fi
          mkdir -p out
          ci/simulators.sh $D > out/sims.txt
          cat out/sims.txt
      - name: Build (Debug, simulator)
        id: build
        run: |
          set -o pipefail
          mkdir -p out
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd -quiet \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/app-build.log | tail -80
      - name: Release build
        id: release
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fast.outputs.fast == '' }}
        run: |
          set -o pipefail
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release -quiet \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/release-build.log | tail -60
      - name: Bundled data
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # the plates and the globe's maps must reach the app byte for byte (an image tool would
          # recompress the one and bend the other's distances)
          APP=build/dd/Build/Products/Debug-iphonesimulator/TerraIncognita.app
          for f in $(find Atlas Globe Prototypes -type f); do cmp "$f" "$APP/$f" || { echo "::error::$f differs in the app bundle"; exit 1; }; done
          for f in OceanCurrents.png OceanStream.png; do cmp "App/TerraIncognita/Ocean/$f" "$APP/$f" || { echo "::error::$f differs in the app bundle"; exit 1; }; done
          echo "bundled data identical"
      - name: Encounter interactions and accessible text
        id: encounter
        # `[build-only]` in a branch commit's message: compile and check the bundle, no simulator time
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !(github.ref_name != 'main' && contains(github.event.head_commit.message, '[build-only]')) && steps.fast.outputs.fast != 'shots' }}
        # both devices in turn, each about an hour on a busy runner, and a crashed test's one rerun
        timeout-minutes: 170
        run: |
          # Focused branch checks support iteration; main's publication gate is always full.
          if [ "$GITHUB_REF_NAME" != main ]; then
            case "${{ inputs.interaction_suite }}" in
              leaf) export UI_TEST_TARGET=TerraIncognitaUITests/MovedPackTests ;;
              whale) export UI_TEST_TARGET=TerraIncognitaUITests/WhaleEncounterTests ;;
              playground) export UI_TEST_TARGET="TerraIncognitaUITests/PlaygroundTests TerraIncognitaUITests/RemotePackTests TerraIncognitaUITests/GlobePackTests TerraIncognitaUITests/MovedPackTests" ;;
            esac
            if [ "${{ contains(github.event.head_commit.message, '[playground-check]') }}" = true ]; then
              export UI_TEST_TARGET="TerraIncognitaUITests/PlaygroundTests TerraIncognitaUITests/RemotePackTests TerraIncognitaUITests/GlobePackTests TerraIncognitaUITests/MovedPackTests"
            fi
            if [ -n "${{ steps.fast.outputs.tests }}" ]; then export UI_TEST_TARGET="${{ steps.fast.outputs.tests }}"; fi
          fi
          # A remote revision of the bundled hello-pack, served on this machine for RemotePackTests:
          # the simulator shares the host's loopback, and xcodebuild hands TEST_RUNNER_* to the tests.
          bash ci/remote_packs.sh build/remote-packs > out/remote-packs.log 2>&1
          node tools/playground/serve.cjs --packs build/remote-packs --port 8790 > out/pack-server.log 2>&1 &
          export TEST_RUNNER_PACKS_URL=http://127.0.0.1:8790/packs/catalog.json
          for _ in $(seq 1 20); do curl -fsS "$TEST_RUNNER_PACKS_URL" > /dev/null 2>&1 && break; sleep 0.5; done
          bash ci/encounter_tests.sh
      - name: Capture camelid playback and compositions
        id: camelid_capture
        # A review artifact, like the manual film screenshots; native tests remain a gate.
        continue-on-error: true
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(github.event.head_commit.message, '[camelid-capture]') }}
        timeout-minutes: 20
        run: |
          # Capture the uninterrupted primary-phone film after native interactions. The UI suite supplies comparable
          # iPad/phone milestone and interaction screenshots without repeating the iPad cold boot.
          sort -r out/sims.txt > out/capture-sims.txt
          while read -r KIND UDID _ <&3; do
            [ "$KIND" = iphone ] || continue
            export CAMELID_VIDEO=1
            bash ci/camelid_capture.sh build/dd/Build/Products/Debug-iphonesimulator/TerraIncognita.app "out/camelid/$KIND" "$UDID"
          done 3< out/capture-sims.txt
      - name: Preserve camelid review capture separately
        continue-on-error: true
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(github.event.head_commit.message, '[camelid-capture]') }}
        with:
          name: camelid-preview
          path: out/camelid
          if-no-files-found: warn
      - name: Capture whale playback and compositions
        id: whale_capture
        continue-on-error: true
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (inputs.whale_capture == true || contains(github.event.head_commit.message, '[whale-capture]')) }}
        timeout-minutes: 20
        run: |
          # Phone first, with a complete recording; other selected devices supply held scenes.
          sort -r out/sims.txt > out/whale-capture-sims.txt
          while read -r KIND UDID _ <&3; do
            if [ "$KIND" = iphone ]; then export WHALE_VIDEO=1; else export WHALE_VIDEO=0; fi
            bash ci/whale_capture.sh build/dd/Build/Products/Debug-iphonesimulator/TerraIncognita.app "out/whale/$KIND" "$UDID"
          done 3< out/whale-capture-sims.txt
      - name: Preserve whale review capture separately
        continue-on-error: true
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (inputs.whale_capture == true || contains(github.event.head_commit.message, '[whale-capture]')) }}
        with:
          name: whale-preview
          path: out/whale
          if-no-files-found: warn
      - name: The stage at places
        # `[shots]`: the stage at rest (the ground's month, the clouds and the sea held) at each place,
        # as tools/metal/metal.py's `shot` draws it at the same names; a report, like the film's
        id: stage
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.fast.outputs.places != '' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          export STAGE_ONLY=1 PLACES="${{ steps.fast.outputs.places }}"
          while read -r KIND UDID _ <&3; do
            ci/sim_shots.sh build/dd/Build/Products/Debug-iphonesimulator/TerraIncognita.app "out/shots/$KIND" "$UDID"
          done 3< out/sims.txt
      - name: Screenshots of the film on the simulator
        # By hand only (Run workflow), and a report, not a gate: a slot's worth of runner time for
        # pictures a person looks at.
        # Focused branch checks attach opening/reading images through XCTest already.
        # Avoid booting both simulators again for duplicate pictures after those checks.
        id: shots
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' && steps.fast.outputs.fast == '' && !(github.ref_name != 'main' && (inputs.interaction_suite == 'leaf' || inputs.interaction_suite == 'whale' || inputs.interaction_suite == 'playground')) }}
        continue-on-error: true
        timeout-minutes: 50
        run: |
          # on each device (the iPad first): the globe in each style (GLOBE=1), then every look at
          # five moments of its film (unless `film` is off); each device's pictures in out/shots/<device>/
          export GLOBE=1 LEAF=1
          if [ "${{ inputs.leaf_only }}" = true ]; then export GLOBE=0; fi
          ALL="$(python3 -c "import json; print(' '.join(l['id'] for l in json.load(open('Atlas/looks.json'))))")"
          # (the list on its own descriptor, so the simulator commands can't read it; macOS's bash is 3.2)
          while read -r KIND UDID _ <&3; do
            if [ "${{ inputs.film }}" = false ] || [ "${{ inputs.leaf_only }}" = true ]; then export LOOKS=""; MOMENTS=""; else export LOOKS="$ALL"; MOMENTS="4 16 28 40 52"; fi
            ci/sim_shots.sh build/dd/Build/Products/Debug-iphonesimulator/TerraIncognita.app "out/shots/$KIND" "$UDID" $MOMENTS
          done 3< out/sims.txt
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          grep -hE "error:|warning:" out/*-build.log 2>/dev/null | sort -u > out/errors.txt || true
          echo "build=${{ steps.build.outcome }} encounter=${{ steps.encounter.outcome }} camelid_capture=${{ steps.camelid_capture.outcome }} whale_capture=${{ steps.whale_capture.outcome }} stage=${{ steps.stage.outcome }} shots=${{ steps.shots.outcome }} release=${{ steps.release.outcome }}" > out/outcomes.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: apple, path: out, if-no-files-found: ignore }

  ipa:
    name: IPA for SideStore (unsigned device build)
    needs: [plates, apple]
    if: ${{ !cancelled() && needs.plates.result == 'success' && needs.apple.result == 'success' && (github.ref_name == 'main' || contains(github.event.head_commit.message, '[ipa]')) }}
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Archive
        run: |
          set -o pipefail
          mkdir -p out
          # Version 1.0.<run>, build <run>: every build is an update to the installed one.
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/TerraIncognita.xcarchive -quiet \
            MARKETING_VERSION="1.0.$BUILD" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee out/ipa-build.log | tail -80
      - name: Package
        run: |
          # SideStore signs the app with the user's Apple ID when installing it.
          APP=build/TerraIncognita.xcarchive/Products/Applications/TerraIncognita.app
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../../out/TerraIncognita.ipa Payload)
          ls -l out/TerraIncognita.ipa
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Info.plist"
      - name: Publish release and SideStore source
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%s > out/notes.txt
          if gh release view "build-$BUILD" > /dev/null 2>&1; then
            gh release upload "build-$BUILD" out/TerraIncognita.ipa --clobber
          else
            gh release create "build-$BUILD" out/TerraIncognita.ipa --prerelease --target "$GITHUB_SHA" \
              --title "Build $BUILD" --notes-file out/notes.txt
          fi
          # Keep the five newest builds (KEEP in ci/sidestore_source.py: the same number).
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | tail -n +6 |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
          SOURCE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/sidestore"
          mkdir -p build/source
          python3 ci/sidestore_source.py build/TerraIncognita.xcarchive/Products/Applications/TerraIncognita.app \
            "$SOURCE/icon.png" > build/source/source.json
          cp ci/sidestore-icon.png build/source/icon.png
          printf '# SideStore source\n\nAdd %s/source.json in SideStore (Sources → +).\n' "$SOURCE" > build/source/README.md
          cp build/source/source.json out/
          cd build/source
          git init -q && git checkout -q -b sidestore && git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "SideStore source for build $BUILD"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "sidestore:refs/heads/sidestore"
      - name: Retire the separate Study II listing after verified main publication
        if: ${{ success() && github.ref_name == 'main' && contains(github.event.head_commit.message, '[retire-study2]') }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/retire_study2.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ipa
          path: |
            out
            !out/*.ipa
          if-no-files-found: ignore
      - name: Preserve isolated branch device build
        uses: actions/upload-artifact@v5
        if: ${{ success() && github.ref_name != 'main' }}
        with:
          name: prototype-device-ipa
          path: out/TerraIncognita.ipa
          if-no-files-found: error

  report:
    name: Publish report
    needs: [plates, apple, ipa]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: report }
      - name: Write status and push to refs/ci-shots/${{ github.ref_name }}
        run: |
          mkdir -p report && cd report
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "recordings: retained in the Actions artifact, outside this git report"
            echo
            echo "plates: ${{ needs.plates.result }}"
            echo "apple: ${{ needs.apple.result }} ($(cat apple/outcomes.txt 2>/dev/null))"
            echo "ipa: ${{ needs.ipa.result }}"
            echo
            if [ -s apple/errors.txt ]; then echo "## compiler errors and warnings"; head -60 apple/errors.txt; echo; fi
            if [ -f plates/plates-check.log ]; then echo "## plates"; tail -20 plates/plates-check.log; fi
            for f in apple/shots/*/sim-steps.log; do [ -f "$f" ] && { echo "## simulator, $(basename "$(dirname "$f")") (report only)"; cat "$f"; }; done
          } > STATUS.md
          cat STATUS.md
          echo "${GITHUB_SHA}" > COMMIT
          # Full test videos stay in the original Actions artifact. Large recordings exceed
          # GitHub's 100 MB file limit; the Git report keeps screenshots, logs and JSON.
          find . -type f -name '*.mp4' -delete
          # Isolated device builds remain downloadable Actions artifacts; do not duplicate them
          # into the screenshot report's Git history.
          find . -type f -name '*.ipa' -delete
          git init -q && git checkout -q -b shots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI report for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "shots:refs/ci-shots/${GITHUB_REF_NAME}"
