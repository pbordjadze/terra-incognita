name: CI

# Every run publishes a report (STATUS.md, logs, screenshots) to the ref refs/ci-shots/<branch>,
# outside refs/heads so a clone never downloads it; ci/fetch.sh waits for it and unpacks it.
#   plates Linux: every look in Atlas/ and the globe's data in Globe/ sound (ci/check_atlas.py,
#          ci/check_globe.py) and the tools' syntax
#   apple  macOS: Debug and Release builds for the simulator and the plates checked byte for byte
#          in the bundle; screenshots only when the workflow is run by hand, as a report: on the
#          13" iPad Pro (the primary device), the iPhone or both, every look at moments of its film
#          (unless `film` is off) and the globe in each style
#   ipa    after a green `apple` job, on main (or `[ipa]` in a branch commit's message, without
#          publishing): an unsigned Release IPA, published as the `build-<n>` prerelease (the five
#          newest are kept), and the SideStore source on the `sidestore` branch, which SideStore
#          reads at https://raw.githubusercontent.com/pbordjadze/terra-incognita/sidestore/source.json
# The macOS runners (5 at once) are shared with pbordjadze/paint-by-number and pbordjadze/pigeon:
# one macOS job per push here.

on:
  push:
    branches-ignore: ['ci-shots/**', 'sidestore']
  workflow_dispatch:
    inputs:
      study2:
        description: Build and publish the isolated Study II test app (experiment branch only)
        type: boolean
        default: false
      device:
        description: Screenshots on
        type: choice
        options: [ipad, iphone, both]
        default: ipad
      film:
        description: The films' moments too (off - the globe only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  PROJECT: App/TerraIncognita.xcodeproj
  SCHEME: TerraIncognita

jobs:
  plates:
    name: The looks' plates, the globe's data and the tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Check Atlas and the plate tools
        run: |
          set -o pipefail
          mkdir -p out
          rc=0
          python3 ci/check_atlas.py 2>&1 | tee out/plates-check.log || rc=1
          python3 ci/check_globe.py 2>&1 | tee -a out/plates-check.log || rc=1
          node ci/check_water.cjs 2>&1 | tee -a out/plates-check.log || rc=1
          node --check Water/water.js || rc=1
          node --check Water/core.js || rc=1
          for f in $(find tools/plates -name '*.js' -o -name '*.cjs' | grep -v -e /vendor/ -e /node_modules/); do
            node --check "$f" 2>&1 | tee -a out/plates-check.log || rc=1
          done
          python3 -m py_compile tools/plates/*.py tools/globe/*.py ci/*.py 2>&1 | tee -a out/plates-check.log || rc=1
          exit $rc
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: plates, path: out, if-no-files-found: ignore }

  apple:
    if: ${{ !(github.ref_name == 'experiment/second-magic' && (inputs.study2 == true || contains(github.event.head_commit.message, '[study2]'))) }}
    name: Simulator builds (screenshots when run by hand)
    runs-on: macos-26
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Start simulator
        # only for screenshots, which run when the workflow is started by hand (below)
        id: sim
        if: github.event_name == 'workflow_dispatch'
        run: |
          D="${{ inputs.device }}"
          if [ "$D" = both ]; then D="ipad iphone"; elif [ -z "$D" ]; then D=ipad; fi
          mkdir -p out
          ci/simulators.sh $D > out/sims.txt
          cat out/sims.txt
          while read -r KIND UDID _; do nohup xcrun simctl boot "$UDID" > "out/boot-$KIND.log" 2>&1 < /dev/null & done < out/sims.txt
      - name: Build (Debug, simulator)
        id: build
        run: |
          set -o pipefail
          mkdir -p out
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd -quiet \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/app-build.log | tail -80
      - name: Release build
        id: release
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release -quiet \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/release-build.log | tail -60
      - name: Bundled data
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # the plates and the globe's maps must reach the app byte for byte (an image tool would
          # recompress the one and bend the other's distances)
          APP=build/dd/Build/Products/Debug-iphonesimulator/TerraIncognita.app
          for f in $(find Atlas Globe -type f); do cmp "$f" "$APP/$f" || { echo "::error::$f differs in the app bundle"; exit 1; }; done
          echo "bundled data identical"
      - name: Screenshots of the film on the simulator
        # By hand only (Run workflow), and a report, not a gate: a slot's worth of runner time for
        # pictures a person looks at.
        id: shots
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        timeout-minutes: 50
        run: |
          # on each device (the iPad first): the globe in each style (GLOBE=1), then every look at
          # five moments of its film (unless `film` is off); each device's pictures in out/shots/<device>/
          export GLOBE=1
          ALL="$(python3 -c "import json; print(' '.join(l['id'] for l in json.load(open('Atlas/looks.json'))))")"
          # (the list on its own descriptor, so the simulator commands can't read it; macOS's bash is 3.2)
          while read -r KIND UDID _ <&3; do
            if [ "${{ inputs.film }}" = false ]; then export LOOKS=""; MOMENTS=""; else export LOOKS="$ALL"; MOMENTS="4 16 28 40 52"; fi
            ci/sim_shots.sh build/dd/Build/Products/Debug-iphonesimulator/TerraIncognita.app "out/shots/$KIND" "$UDID" $MOMENTS
          done 3< out/sims.txt
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          grep -hE "error:|warning:" out/*-build.log 2>/dev/null | sort -u > out/errors.txt || true
          echo "build=${{ steps.build.outcome }} shots=${{ steps.shots.outcome }} release=${{ steps.release.outcome }}" > out/outcomes.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: apple, path: out, if-no-files-found: ignore }

  ipa:
    name: IPA for SideStore (unsigned device build)
    needs: apple
    if: ${{ !cancelled() && needs.apple.result == 'success' && (github.ref_name == 'main' || contains(github.event.head_commit.message, '[ipa]')) }}
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Archive
        run: |
          set -o pipefail
          mkdir -p out
          # Version 1.0.<run>, build <run>: every build is an update to the installed one.
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/TerraIncognita.xcarchive -quiet \
            MARKETING_VERSION="1.0.$BUILD" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee out/ipa-build.log | tail -80
      - name: Package
        run: |
          # SideStore signs the app with the user's Apple ID when installing it.
          APP=build/TerraIncognita.xcarchive/Products/Applications/TerraIncognita.app
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../../out/TerraIncognita.ipa Payload)
          ls -l out/TerraIncognita.ipa
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Info.plist"
      - name: Publish release and SideStore source
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%s > out/notes.txt
          if gh release view "build-$BUILD" > /dev/null 2>&1; then
            gh release upload "build-$BUILD" out/TerraIncognita.ipa --clobber
          else
            gh release create "build-$BUILD" out/TerraIncognita.ipa --prerelease --target "$GITHUB_SHA" \
              --title "Build $BUILD" --notes-file out/notes.txt
          fi
          # Keep the five newest builds (KEEP in ci/sidestore_source.py: the same number).
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | tail -n +6 |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
          SOURCE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/sidestore"
          mkdir -p build/source
          python3 ci/sidestore_source.py build/TerraIncognita.xcarchive/Products/Applications/TerraIncognita.app \
            "$SOURCE/icon.png" > build/source/source.json
          cp ci/sidestore-icon.png build/source/icon.png
          printf '# SideStore source\n\nAdd %s/source.json in SideStore (Sources → +).\n' "$SOURCE" > build/source/README.md
          cp build/source/source.json out/
          cd build/source
          git init -q && git checkout -q -b sidestore && git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "SideStore source for build $BUILD"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "sidestore:refs/heads/sidestore"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ipa
          path: |
            out
            !out/*.ipa
          if-no-files-found: ignore

  study2:
    name: Study II — isolated simulator tests and SideStore build
    needs: plates
    if: ${{ github.ref_name == 'experiment/second-magic' && (inputs.study2 == true || contains(github.event.head_commit.message, '[study2]')) }}
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 80
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Start iPhone and iPad
        run: |
          mkdir -p out
          ci/simulators.sh iphone ipad > out/sims.txt
          while read -r KIND UDID _; do nohup xcrun simctl boot "$UDID" > "out/boot-$KIND.log" 2>&1 < /dev/null & done < out/sims.txt
      - name: Debug build
        run: |
          set -o pipefail
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/study2-debug -quiet \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee out/study2-debug.log | tail -80
          APP=build/study2-debug/Build/Products/Debug-iphonesimulator/TerraIncognita.app
          python3 - "$APP" <<'PYDATA'
          from pathlib import Path
          import sys
          app=Path(sys.argv[1])
          for root in ['Atlas','Globe','Water']:
              for f in Path(root).rglob('*'):
                  if f.is_file(): assert f.read_bytes()==(app/f).read_bytes(), str(f)
          print('All three bundled data folders identical')
          PYDATA
      - name: Record native opening views before interaction tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=build/study2-debug/Build/Products/Debug-iphonesimulator/TerraIncognita.app
          mkdir -p out/study2-opening build/study2-preview
          while read -r KIND UDID _ <&3; do
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch --terminate-running-process "$UDID" com.pbordjadze.terraincognita -water
            sleep 5
            xcrun simctl io "$UDID" screenshot "out/study2-opening/$KIND.png"
            xcrun simctl terminate "$UDID" com.pbordjadze.terraincognita
          done 3< out/sims.txt
          cp out/study2-opening/*.png build/study2-preview/
          echo "$GITHUB_SHA" > build/study2-preview/COMMIT
          cd build/study2-preview
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Native opening views"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/ci-shots/${GITHUB_REF_NAME}-opening"
      - name: Touch, sources and largest text on both simulators
        run: bash ci/study2_tests.sh
      - name: Release and device archive
        run: |
          set -o pipefail
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/study2-release -quiet \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee out/study2-release.log | tail -80
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/StudyII.xcarchive -quiet \
            PRODUCT_BUNDLE_IDENTIFIER=com.pbordjadze.terraincognita.study2 \
            'INFOPLIST_KEY_CFBundleDisplayName=Terra Incognita II' \
            MARKETING_VERSION="1.0.$BUILD" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee out/study2-device.log | tail -80
      - name: Package independent test app
        run: |
          APP=build/StudyII.xcarchive/Products/Applications/TerraIncognita.app
          mkdir -p build/study2-ipa/Payload
          cp -R "$APP" build/study2-ipa/Payload/
          (cd build/study2-ipa && zip -qry ../../out/TerraIncognita-StudyII.ipa Payload)
          cp ci/sidestore-icon.png out/icon.png
          python3 ci/study2_source.py "$APP" out/TerraIncognita-StudyII.ipa \
            "$GITHUB_REPOSITORY" "study2-$GITHUB_RUN_ID" "$BUILD" > out/study2-source.json
      - name: Publish only this study's immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > out/notes.txt <<'NOTES'
          Independent Study II test app. Install using the attached SideStore source, or import the IPA directly. This has its own bundle identifier and leaves the ordinary app and SideStore source intact. No account, location access, or saved exploration.
          NOTES
          gh release create "study2-$GITHUB_RUN_ID" out/TerraIncognita-StudyII.ipa out/study2-source.json out/icon.png \
            --prerelease --target "$GITHUB_SHA" --title "Terra Incognita — Study II ($BUILD)" --notes-file out/notes.txt
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/study2-$GITHUB_RUN_ID/study2-source.json" > out/STUDY2-ACCESS.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: study2
          path: |
            out
            !out/*.ipa
          if-no-files-found: ignore

  report:
    name: Publish report
    needs: [plates, apple, ipa, study2]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: report }
      - name: Write status and push to refs/ci-shots/${{ github.ref_name }}
        run: |
          mkdir -p report && cd report
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "plates: ${{ needs.plates.result }}"
            echo "apple: ${{ needs.apple.result }} ($(cat apple/outcomes.txt 2>/dev/null))"
            echo "ipa: ${{ needs.ipa.result }}"
            echo "study2: ${{ needs.study2.result }}"
            echo
            if [ -s apple/errors.txt ]; then echo "## compiler errors and warnings"; head -60 apple/errors.txt; echo; fi
            if [ -f plates/plates-check.log ]; then echo "## plates"; tail -20 plates/plates-check.log; fi
            for f in apple/shots/*/sim-steps.log; do [ -f "$f" ] && { echo "## simulator, $(basename "$(dirname "$f")") (report only)"; cat "$f"; }; done
          } > STATUS.md
          cat STATUS.md
          echo "${GITHUB_SHA}" > COMMIT
          git init -q && git checkout -q -b shots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI report for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "shots:refs/ci-shots/${GITHUB_REF_NAME}"
