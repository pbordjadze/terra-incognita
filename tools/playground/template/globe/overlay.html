<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}: overlay</title>
<style>
  /* An overlay lies over the live globe and takes no touches: keep it transparent and quiet. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="ring" aria-hidden="true"></canvas>
<script>
  // A ring on the globe's surface around one place, redrawn each time the camera moves.
  // terra.project() turns a longitude and latitude into a point on screen (and says whether the
  // place faces us); the host calls the camera listener every frame the globe moves.
  var PLACE = { lon: 10, lat: 35 };   // the ring's centre
  var SPAN = 8;                        // its radius, in degrees of arc on the globe
  var INK = '#3B2C16';
  var STEPS = 90;

  var canvas = document.getElementById('ring');
  var g = canvas.getContext('2d');
  var shown = terra.settings.reduceMotion ? 1 : 0;   // opacity: it fades in once, unless motion is reduced

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // the point `span` degrees from PLACE in the direction `bearing` (a great-circle step)
  function around(bearing) {
    var d = SPAN * Math.PI / 180, p = PLACE.lat * Math.PI / 180, l = PLACE.lon * Math.PI / 180;
    var lat = Math.asin(Math.sin(p) * Math.cos(d) + Math.cos(p) * Math.sin(d) * Math.cos(bearing));
    var lon = l + Math.atan2(Math.sin(bearing) * Math.sin(d) * Math.cos(p), Math.cos(d) - Math.sin(p) * Math.sin(lat));
    return { lon: lon * 180 / Math.PI, lat: lat * 180 / Math.PI };
  }

  function draw() {
    g.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!terra.camera) return;
    g.strokeStyle = INK;
    g.globalAlpha = 0.6 * shown;
    g.lineWidth = 1.5;
    g.beginPath();
    var pen = false;
    for (var i = 0; i <= STEPS; i++) {
      var q = around(i / STEPS * 2 * Math.PI);
      var s = terra.project(q.lon, q.lat);
      if (s && s.facing > 0.05) {            // only the part on the near side of the globe
        if (pen) g.lineTo(s.x, s.y); else g.moveTo(s.x, s.y);
        pen = true;
      } else {
        pen = false;
      }
    }
    g.stroke();
  }

  terra.on('camera', draw);                  // called at once if the camera is known, then on every move
  terra.on('settings', function (s) {
    if (s.reduceMotion) { shown = 1; draw(); }
  });
  window.addEventListener('resize', resize);
  resize();

  if (!terra.settings.reduceMotion) {        // the one animation: a slow fade-in
    var start = performance.now();
    (function fade(now) {
      shown = Math.min(1, (now - start) / 700);
      draw();
      if (shown < 1 && !terra.settings.reduceMotion) requestAnimationFrame(fade);
    })(start);
  }
</script>
</body>
</html>
