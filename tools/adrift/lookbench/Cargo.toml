[package]
name = "lookbench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Draws the look's marks over a stand-in sea with wgpu, headless, from a scene study.py writes (src/main.rs says how)."

[workspace]

[dependencies]
adrift-core = { path = "../../../adrift/crates/adrift-core" }
wgpu = { version = "26", default-features = false, features = ["wgsl", "vulkan", "metal"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
