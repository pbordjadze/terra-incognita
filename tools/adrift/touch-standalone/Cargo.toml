[package]
name = "touch-standalone"
version = "0.1.0"
edition = "2021"
description = "Builds and plays Adrift's touch module (adrift-core/src/touch) without the rest of adrift-core"
publish = false

[[bin]]
name = "touch-replay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
