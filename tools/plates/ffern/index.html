<!doctype html>
<meta charset="utf-8">
<title>Paper Almanac</title>
<!-- The Paper Almanac look: the map as a seasonal almanac made by hand, in late October. The sheet is
     cream stock, the water a watercolour wash, the land torn coloured paper, the names letterpressed,
     the plants stamped, the living things painted and cut out. The contract is in ../kit.js; the
     materials are in paper.js, the living things in sprites.js. -->
<script src="../vendor/d3.min.js"></script>
<script src="../vendor/topojson.min.js"></script>
<script src="../kit.js"></script>
<script src="paper.js"></script>
<script src="sprites.js"></script>
<style>
@font-face { font-family: 'CG'; font-style: normal; src: url('fonts/CormorantGaramond-SemiBold.ttf'); font-display: block; }
@font-face { font-family: 'CG'; font-style: italic; src: url('fonts/CormorantGaramond-MediumItalic.ttf'); font-display: block; }
@font-face { font-family: 'CSC'; src: url('fonts/CormorantSC-SemiBold.ttf'); font-display: block; }
body { margin: 0; background: transparent; }
</style>
<script>
'use strict';
const { W, H, U, C, f1, f2 } = PA;
const CX = W / 2, CY = H / 2;
const D = name => Kit.json(`../data/${name}`);
const OWN = name => Kit.json(`data/${name}`);

// ---------- the levels ----------
const WORLD_R = 440;
const RING = { outer: 552, inner: 486, names: 509 };
const NOW_DEG = 304;     // the wheel's arm: the last week of October, a few days short of All Hallows
const LEVELS = [
  { id: 'world', proj: () => Kit.lens(WORLD_R),
    caption: { eyebrow: 'Late October', title: 'The Turning World', text: 'The hunter’s moon is full over the sea.' } },
  { id: 'america', proj: () => Kit.lens(Kit.km(5200)),
    caption: { eyebrow: 'North America', title: 'The Long Flight South', text: 'The geese cross the Great Lakes for winter.' } },
  { id: 'ohio', proj: () => Kit.lens(Kit.km(660)),
    caption: { eyebrow: 'Ohio', title: 'The Buckeye Country', text: 'Between Lake Erie and the Ohio River.' } },
  { id: 'columbus', proj: () => Kit.lens(Kit.km(48)),
    caption: { eyebrow: 'Columbus', title: 'Inside the Ring', text: 'Where the Olentangy meets the Scioto.' } },
  { id: 'shortnorth', proj: () => Kit.lens(Kit.km(1.5)),
    caption: { eyebrow: 'Short North', title: 'High Street', text: 'Under the maples, the year is turning.' } },
];

// Sprites: where each sits on its plate (plate pixels), its scale (plate pixels per point) and its motion.
const SPRITES = {
  world: [
    { name: 'arm', depth: 0, frame: armFrame(), motion: { kind: 'sway', angle: 0.9, period: 9, phase: 0, anchor: [CX, CY] } },
    { name: 'ship', depth: 0.02, at: [1062, 1905], s: 1.25, box: [-30, -44, 70, 54], motion: { kind: 'bob', amp: [0, 3], period: 6, phase: 0.2 } },
  ],
  america: [
    { name: 'geese', depth: 0.03, at: [1040, 1420], s: 2.5, box: [-24, -46, 50, 20], motion: { kind: 'bob', amp: [-5, 4], period: 7.5, phase: 0.1 } },
    { name: 'serpent', depth: 0.02, at: [1168, 2070], s: 1.45, center: [224, 214], box: [110, 150, 340, 276], motion: { kind: 'bob', amp: [0, 4], period: 8, phase: 0.6 } },
  ],
  shortnorth: [
    { name: 'maple', depth: 0.12, at: [1235, 905], s: 3.6, rot: 28, box: [-26, -48, 30, 10], motion: { kind: 'sway', angle: 3, period: 8.5, phase: 0, anchor: [1235, 905] } },
    { name: 'oak', depth: 0.1, at: [372, 1105], s: 3.4, rot: -38, box: [-34, -42, 26, 14], motion: { kind: 'sway', angle: -2.6, period: 7, phase: 0.4, anchor: [372, 1105] } },
  ],
  columbus: [
    { name: 'heron', depth: 0.02, at: [557, 1650], s: 2.6, box: [-16, -48, 18, 6], motion: { kind: 'bob', amp: [0, -2.5], period: 7.5, phase: 0.15 } },
  ],
  ohio: [
    { name: 'cardinal', depth: 0.02, at: [535, 2364], s: 3.3, box: [-20, -22, 16, 5], motion: { kind: 'bob', amp: [0, -3], period: 5.5, phase: 0.3 } },
  ],
};
const OHIO_SPRIG = { at: [455, 2440], s: 4 };
function armFrame() {
  const a = NOW_DEG * Math.PI / 180, pts = [];
  for (const r of [RING.inner - 22, RING.outer + 22]) for (const da of [-0.05, 0.05]) pts.push([CX + r * Math.sin(a + da), CY - r * Math.cos(a + da)]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.floor(Math.min(...xs)) - 12, y0 = Math.floor(Math.min(...ys)) - 12;
  return [x0, y0, Math.ceil(Math.max(...xs)) + 12 - x0, Math.ceil(Math.max(...ys)) + 12 - y0];
}
const spriteFrame = sp => {
  if (sp.frame) return sp.frame;
  const [cx, cy] = sp.center || [0, 0];
  return [Math.floor(sp.at[0] + (sp.box[0] - cx) * sp.s), Math.floor(sp.at[1] + (sp.box[1] - cy) * sp.s), Math.ceil((sp.box[2] - sp.box[0]) * sp.s), Math.ceil((sp.box[3] - sp.box[1]) * sp.s)];
};

window.Plates = {
  levels: LEVELS.length,
  style: {
    fonts: ['fonts/CormorantSC-SemiBold.ttf', 'fonts/CormorantGaramond-SemiBold.ttf', 'fonts/CormorantGaramond-MediumItalic.ttf'],
    eyebrow: { font: 'CormorantSC-SemiBold', size: 15, color: '#8e4228', tracking: 2.4, uppercase: false },
    title: { font: 'CormorantGaramond-SemiBold', size: 31, color: '#2e2a20' },
    text: { font: 'CormorantGaramond-MediumItalic', size: 18, color: '#3d372a', italic: true },
    scrim: '#efe8d8e6', accent: '#b0603e',
  },
  info(level) {
    const L = LEVELS[level - 1], next = LEVELS[level];
    const layers = [{ name: 'ground', opaque: true, depth: 0 }, { name: 'labels', depth: 0.04 }];
    for (const sp of SPRITES[L.id] || []) layers.push({ name: sp.name, depth: sp.depth || 0, frame: spriteFrame(sp), motion: sp.motion });
    return { id: L.id, caption: L.caption, layers, child: next ? Kit.childRect(L.proj(), next.proj()) : null };
  },
};

// ---------- geography helpers ----------
const polysOf = g => g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
// Torn pieces from features: each polygon given its paper (or left out), the small ones grouped by
// where they lie, so each group's filter stays local.
function pieceSet(features, proj, paperOf, opts = {}) {
  const path = opts.path || d3.geoPath(proj), groups = new Map();
  for (const f of features) {
    for (const poly of polysOf(f.geometry)) {
      const g = { type: 'Polygon', coordinates: poly };
      const a = path.area(g);
      if (!(a > (opts.minArea ?? 4))) continue;
      const [lon, lat] = d3.geoCentroid(g);
      const paper = paperOf(f, lon, lat);
      if (!paper) continue;
      const small = a < (opts.smallArea ?? 220);
      const c = small ? path.centroid(g) : null;
      const key = paper + (small ? ':s:' + Math.floor(c[0] / 420) + '_' + Math.floor(c[1] / 420) : '');
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(path(g));
    }
  }
  return [...groups].map(([key, ds]) => { const [paper, s, cell] = key.split(':'); return { paper, small: !!s, cell, d: ds.join('') }; });
}
const allD = pieces => pieces.map(p => p.d).join('');
// Where two countries of different papers meet: the line the seam is torn along.
function paperSeams(topo, path) {
  const paperOfCountry = f => { const [lon, lat] = d3.geoCentroid(f); return countryPaper(f, lon, lat); };
  const feats = new Map(topojson.feature(topo, topo.objects.countries).features.map(f => [f.id + f.properties.name, f]));
  const papers = new Map([...feats].map(([k, f]) => [k, paperOfCountry(f)]));
  const key = g => g.id + g.properties.name;
  return path(topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b && papers.get(key(a)) !== papers.get(key(b))));
}
// At street scale d3's spherical clipping merges vertices closer than its epsilon (a millionth of a
// radian, several metres here), which folds houses into triangles. Near the lens centre nothing needs
// clipping, so this path projects each vertex straight through and joins them.
function flatPath(proj) {
  const ring = (r, close) => { let d = ''; for (let i = 0; i < r.length; i++) { const p = proj(r[i]); d += (i ? 'L' : 'M') + f1(p[0]) + ',' + f1(p[1]); } return d + (close ? 'Z' : ''); };
  const geom = g => {
    if (!g) return '';
    switch (g.type) {
      case 'Polygon': return g.coordinates.map(r => ring(r, true)).join('');
      case 'MultiPolygon': return g.coordinates.map(p => p.map(r => ring(r, true)).join('')).join('');
      case 'LineString': return ring(g.coordinates, false);
      case 'MultiLineString': return g.coordinates.map(r => ring(r, false)).join('');
      default: return '';
    }
  };
  const draw = o => o.type === 'FeatureCollection' ? o.features.map(f => geom(f.geometry)).join('') : o.type === 'Feature' ? geom(o.geometry) : geom(o);
  const shoelace = r => { let a = 0; for (let i = 0; i < r.length - 1; i++) { const p = proj(r[i]), q = proj(r[i + 1]); a += p[0] * q[1] - q[0] * p[1]; } return Math.abs(a / 2); };
  draw.area = o => { const g = o.geometry || o; return g.type === 'Polygon' ? shoelace(g.coordinates[0]) : g.type === 'MultiPolygon' ? g.coordinates.reduce((s, p) => s + shoelace(p[0]), 0) : 0; };
  draw.centroid = o => { const g = o.geometry || o, r = g.type === 'Polygon' ? g.coordinates[0] : g.coordinates[0][0]; const ps = r.map(proj); return [d3.mean(ps, p => p[0]), d3.mean(ps, p => p[1])]; };
  return draw;
}

// Country paper on the world and continent plates, chosen by where each polygon lies.
const SOUTH_AMERICA = new Set(['032', '068', '076', '152', '170', '218', '328', '600', '604', '740', '858', '862', '238', '780']);
function countryPaper(f, lon, lat) {
  const id = f.id;
  if (id === '840') return 'kraft';
  if (id === '124' || id === '304' || id === '352' || id === '010' || lat < -60) return 'washi';
  if (SOUTH_AMERICA.has(id) || (lon > -82 && lon < -34 && lat < 13)) return 'ochre';
  if (lon > -120 && lon < -58 && lat > 6.5 && lat < 33) return 'clay';
  if (lon > -25 && lon < 50 && lat >= 35) return 'heather';
  if (lon > -20 && lon < 55 && lat < 37) return 'clay';
  return 'heather';
}

// ---------- the world: the globe as a cut paper disc, inside a printed wheel of the year ----------
async function worldGround(L, proj, rand) {
  const path = d3.geoPath(proj);
  const topo = await D('countries-50m.json');
  const countries = topojson.feature(topo, topo.objects.countries).features;
  const states = (await D('america-states.geojson')).features;
  const ohio = states.filter(f => f.properties.name === 'Ohio');
  const pieces = pieceSet(countries, proj, countryPaper, { smallArea: 300 });
  const ohioD = path({ type: 'FeatureCollection', features: ohio });
  const sphere = path({ type: 'Sphere' });
  const inset = d3.geoPath(Kit.lens(WORLD_R - 9))({ type: 'Sphere' });
  const out = [PA.defs(), Sprites.ptDefs(), PA.sheet(rand)];

  // the wheel: printed on the sheet around the globe
  out.push(ringPrint());
  // the globe: a disc of heavier card, the sea washed onto it, rounder where the wash pools at the limb
  out.push(`<path d="${sphere}" fill="#f3ede0" filter="url(#card)"/>`);
  out.push(PA.wash(inset, allD(pieces) + ohioD, { reserve: 3.6, opacity: 0.6 }));
  out.push(`<radialGradient id="limb" cx="${CX - 90}" cy="${CY - 120}" r="${WORLD_R + 60}" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="${C.seaDeep}" stop-opacity="0"/><stop offset="0.97" stop-color="${C.seaDeep}" stop-opacity="0.38"/></radialGradient>
    <path d="${inset}" fill="url(#limb)" style="mix-blend-mode:multiply"/>`);
  out.push(PA.pencil(d3.geoPath(proj)(d3.geoGraticule().step([30, 30])()), { dx: 0, dy: 0, width: 0.35, opacity: 0.32 }));
  out.push(PA.pencil(allD(pieces), { width: 0.4, opacity: 0.4 }));
  out.push(`<clipPath id="globeClip"><path d="${sphere}"/></clipPath>`);
  out.push(`<g clip-path="url(#globeClip)">${PA.tornBase(pieces)}${PA.seam(paperSeams(topo, path))}</g>`);
  out.push(PA.torn([{ d: ohioD, paper: 'sage', small: true }]));
  // the hunter's moon over the world
  out.push(moon(CX, 975, 46));
  return out.join('\n');
}

// The printed ring: hairlines, the weeks, the cross-quarter days' plants (the quarter days' names are
// on the labels layer).
function ringPrint() {
  const pol = (r, a) => [CX + r * Math.sin(a), CY - r * Math.cos(a)];
  let ticks = '';
  for (let k = 0; k < 52; k++) {
    const a = k / 52 * 2 * Math.PI, long = k % 13 === 0;
    const p1 = pol(RING.outer - 20, a), p2 = pol(RING.outer - (long ? 3 : 10), a);
    ticks += `M${f1(p1[0])} ${f1(p1[1])}L${f1(p2[0])} ${f1(p2[1])}`;
  }
  const s = 4.2;   // plate pixels per point for the plants
  const plant = (deg, kind) => {
    const a = deg * Math.PI / 180, [x, y] = pol(RING.names, a);
    return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${deg}) scale(${s})">${PLANTS[kind]}</g>`;
  };
  return `<g fill="none" stroke="${C.ink}" style="mix-blend-mode:multiply" filter="url(#inkline)" opacity="0.85">
      <circle cx="${CX}" cy="${CY}" r="${RING.outer}" stroke-width="${f2(0.55 * U)}"/><circle cx="${CX}" cy="${CY}" r="${RING.outer - 20}" stroke-width="${f2(0.35 * U)}"/>
      <circle cx="${CX}" cy="${CY}" r="${RING.inner}" stroke-width="${f2(0.35 * U)}"/><path d="${ticks}" stroke-width="${f2(0.32 * U)}"/></g>
    <g style="mix-blend-mode:multiply">${plant(45, 'snowdrop')}${plant(135, 'may')}${plant(225, 'wheat')}${plant(315, 'apple')}</g>`;
}
// The cross-quarter days' plants, in points: snowdrop (Candlemas), may blossom (May Day), wheat (Lammas),
// an apple (All Hallows).
const PLANTS = {
  snowdrop: `<path d="M0 3C0 0 0.4 -1.6 1.6 -2.4" stroke="${C.sageDeep}" stroke-width="0.55" fill="none"/><path d="M1.6 -2.4C2.8 -2.2 3 0 2.2 1.2C1.6 2 0.8 1.2 1.6 -2.4Z" fill="#fbf7ec" stroke="${C.ink}" stroke-width="0.3"/><path d="M-0.2 3C-1.4 1 -1.6 -0.6 -1.2 -2" stroke="${C.sage}" stroke-width="0.7" fill="none"/>`,
  may: [0, 1, 2, 3, 4].map(k => { const b = k / 5 * 2 * Math.PI; return `<circle cx="${f2(Math.sin(b) * 1.5)}" cy="${f2(-Math.cos(b) * 1.5)}" r="1.05" fill="#fbf7ec" stroke="${C.ink}" stroke-width="0.25"/>`; }).join('') + `<circle r="0.6" fill="${C.ochre}"/>`,
  wheat: `<path d="M0 3.4V-3.2" stroke="${C.ochreDeep}" stroke-width="0.45"/>` + [0, 1, 2, 3].map(k => { const yy = -2.6 + k * 1.3; return `<ellipse cx="-0.85" cy="${yy}" rx="0.55" ry="0.95" transform="rotate(-28 -0.85 ${yy})" fill="${C.ochre}"/><ellipse cx="0.85" cy="${yy}" rx="0.55" ry="0.95" transform="rotate(28 0.85 ${yy})" fill="${C.ochre}"/>`; }).join(''),
  apple: `<path d="M0 -1.6C-1.4 -2.6 -3 -1.6 -2.8 0.4C-2.6 2.4 -1 3 0 2.4C1 3 2.6 2.4 2.8 0.4C3 -1.6 1.4 -2.6 0 -1.6Z" fill="${C.haw}"/><path d="M0 -1.6C0.2 -2.6 0.6 -3 1 -3.2" stroke="${C.ink}" stroke-width="0.4" fill="none"/><path d="M0.5 -2.5C1.6 -3.6 2.8 -3 2.6 -2.4C1.8 -2 1 -2.2 0.5 -2.5Z" fill="${C.sage}"/>`,
};

// The full moon, painted, with a sprig of rowan to either side.
function moon(x, y, r) {
  const sprig = dir => {
    let s = `<path d="M0 0q${dir * 8} -0.9 ${dir * 16} 0" stroke="${C.sageDeep}" stroke-width="0.5" fill="none"/>`;
    for (let k = 0; k < 4; k++) {
      const px = dir * (3 + k * 3.4), up = k % 2 ? 1 : -1;
      s += `<path d="M${f1(px)} -0.3q${f1(dir * 1.4)} ${f1(up * 2.4)} ${f1(dir * 3.6)} ${f1(up * 2.6)}q${f1(-dir)} ${f1(-up * 1.6)} ${f1(-dir * 3.6)} ${f1(-up * 2.6)}z" fill="${C.sage}"/>`;
    }
    return s + `<circle cx="${dir * 17.6}" cy="-0.4" r="1.05" fill="${C.haw}"/><circle cx="${dir * 16.4}" cy="1.3" r="0.9" fill="${C.haw}"/>`;
  };
  const sc = 4.6, gap = r + 1.2 * U;
  return `<g style="mix-blend-mode:multiply" filter="url(#riso)">
      <path d="M${f1(x - gap - 34 * sc)} ${y}H${f1(x - gap - 19 * sc)}M${f1(x + gap + 19 * sc)} ${y}H${f1(x + gap + 34 * sc)}" stroke="${C.rust}" stroke-width="${f2(0.55 * U)}"/>
      <g transform="translate(${f1(x - gap)} ${y}) scale(${sc})">${sprig(-1)}</g><g transform="translate(${f1(x + gap)} ${y}) scale(${sc})">${sprig(1)}</g></g>
    <circle cx="${x}" cy="${y}" r="${r * 1.9}" fill="#f6e7b8" opacity="0.32" style="filter:blur(${f1(r * 0.35)}px)"/>
    <g filter="url(#gouache)"><circle cx="${x}" cy="${y}" r="${r}" fill="#eedcaa"/>
      <circle cx="${x - r * 0.3}" cy="${y - r * 0.22}" r="${r * 0.32}" fill="#d8c08a" opacity="0.6"/><circle cx="${x + r * 0.34}" cy="${y + r * 0.26}" r="${r * 0.22}" fill="#d8c08a" opacity="0.55"/>
      <circle cx="${x + r * 0.05}" cy="${y + r * 0.5}" r="${r * 0.14}" fill="#d8c08a" opacity="0.45"/></g>
    <circle cx="${x + 1}" cy="${y + 1}" r="${r}" fill="none" stroke="${C.ink}" stroke-width="${f2(0.4 * U)}" filter="url(#inklineS)" opacity="0.8"/>`;
}

function worldLabels(L, proj) {
  const pol = (r, a) => [CX + r * Math.sin(a), CY - r * Math.cos(a)];
  let arcs = '', txt = '';
  [['MIDWINTER', 0], ['LADY DAY', 90], ['MIDSUMMER', 180], ['MICHAELMAS', 270]].forEach(([nm, deg], i) => {
    const a = deg * Math.PI / 180, span = 0.5, bottom = deg > 90 && deg < 270;
    const r = RING.names + (bottom ? 10 : -10);
    const p1 = pol(r, bottom ? a + span : a - span), p2 = pol(r, bottom ? a - span : a + span);
    arcs += `<path id="qd${i}" d="M${f1(p1[0])} ${f1(p1[1])}A${r} ${r} 0 0 ${bottom ? 0 : 1} ${f1(p2[0])} ${f1(p2[1])}"/>`;
    txt += `<text font-family="CSC" font-size="${f2(6.4 * U)}" letter-spacing="${f2(0.9 * U)}" text-anchor="middle" dominant-baseline="central"><textPath href="#qd${i}" startOffset="50%">${nm}</textPath></text>`;
  });
  const sea = (lon, lat, a, b) => { const [x, y] = proj([lon, lat]); return [[x, y, a, { size: 8.6, italic: true, track: 0.28, fill: C.seaInk }], [x, y + 11 * U, b, { size: 8.6, italic: true, track: 0.28, fill: C.seaInk }]]; };
  return `<defs>${arcs}</defs><g filter="url(#deboss)" fill="#000">${txt}</g><g filter="url(#press)" fill="${C.ink}">${txt}</g>
    ${PA.letterpress([...sea(-43, 31, 'OCEANVS', 'ATLANTICVS'), ...sea(-127, 16, 'MARE', 'PACIFICVM')])}`;
}

// The wheel's arm: a strip of cream card pointing at now.
function worldArm() {
  const a = NOW_DEG * Math.PI / 180, pol = (r, da = 0, w = 0) => [CX + r * Math.sin(a) + w * Math.cos(a), CY - r * Math.cos(a) + w * Math.sin(a)];
  const r0 = RING.inner - 16, r1 = RING.outer + 16, hw = 3.4 * U;
  const p = [pol(r0, 0, -hw), pol(r1 - 22, 0, -hw * 0.8), pol(r1), pol(r1 - 22, 0, hw * 0.8), pol(r0, 0, hw)];
  const d = 'M' + p.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z';
  const dot = pol(r1 - 34);
  return `${PA.defs()}<path d="${d}" fill="#f7f1e3" filter="url(#card)"/><path d="${d}" fill="none" stroke="${C.ink}" stroke-width="${f2(0.35 * U)}" filter="url(#inklineS)" opacity="0.8"/>
    <circle cx="${f1(dot[0])}" cy="${f1(dot[1])}" r="${f1(1.1 * U)}" fill="${C.rust}"/>`;
}

// ---------- North America: the continent in torn papers, the Great Lakes torn out of it ----------
// d3 wants exteriors clockwise; a ring the other way round would cover the rest of the world.
function rewound(f) {
  const g = JSON.parse(JSON.stringify(f.geometry));
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
  for (const p of polys) if (d3.geoArea({ type: 'Polygon', coordinates: [p[0]] }) > 2 * Math.PI) p.forEach(r => r.reverse());
  return { type: 'Feature', properties: f.properties, geometry: g };
}
const MAJOR_RIVERS = new Set(['Mississippi', 'Missouri', 'Ohio', 'St. Lawrence', 'Mackenzie', 'Yukon', 'Rio Grande', 'Colorado', 'Columbia', 'Arkansas', 'Tennessee', 'Nelson', 'Saskatchewan', 'Red', 'Platte', 'Hudson']);
async function americaGround(L, proj, rand) {
  const path = d3.geoPath(proj);
  const [topo, states, rivers, mountains, lakeData] = await Promise.all([D('countries-50m.json'), D('america-states.geojson'), D('america-rivers.geojson'), OWN('mountains.json'), D('america-lakes.geojson')]);
  // the big lakes are torn out of the land, and the wash runs into them
  const lakes = lakeData.features.filter(f => path.area(f) > 40);
  const lakesD = path({ type: 'FeatureCollection', features: lakes });
  const countries = topojson.feature(topo, topo.objects.countries).features;
  // the 10 m states for the three countries in the data's box, 50 m for everything else (and the far
  // Arctic, which the box cuts)
  const base = pieceSet(countries.filter(f => f.id !== '840' && f.id !== '484'), proj,
    (f, lon, lat) => f.id === '124' ? (lat > 73.4 ? 'washi' : null) : countryPaper(f, lon, lat));

// ---------- Short North: kraft card with its streets cut through, the houses laid on in cut card, the trees stamped ----------
const STREET_W = { motorway: 24, motorway_link: 10, trunk: 22, primary: 20, secondary: 17, secondary_link: 9, tertiary: 15, residential: 11.5, unclassified: 10, living_street: 8.5, service: 6, pedestrian: 7 };
async function shortnorthGround(L, proj, rand) {

  out.push(`<clipPath id="noWater"><path clip-rule="evenodd" d="M-60 -60H${W + 60}V${H + 60}H-60Z${pondD}"/></clipPath>`);

  out.push(PA.torn(pieceSet(green.features, proj, greenOf, { minArea: 30, smallArea: 900, path }).map(p => ({ ...p, clip: 'noWater' }))));

  for (const [cls, w] of Object.entries(STREET_W)) {
    const fs = roads.features.filter(f => f.properties.class === cls);
    if (fs.length) streets += `<path d="${path({ type: 'FeatureCollection', features: fs })}" stroke-width="${f2(w * m)}"/>`;
  }
  out.push(`<g filter="url(#cutStreet)"><g fill="none" stroke="#f2ebdc" stroke-linecap="round" stroke-linejoin="round">${streets}</g></g>`);
  const foot = { type: 'FeatureCollection', features: roads.features.filter(f => ['footway', 'path', 'cycleway', 'steps'].includes(f.properties.class)) };
  out.push(PA.pencil(path(foot), { dx: 0, dy: 0, width: 0.35, opacity: 0.4, dash: `${f2(1.4 * U)} ${f2(1.1 * U)}` }));

      <path d="${railD}" stroke-width="${f2(1.25 * U)}" stroke="#c4a882"/><path d="${railD}" stroke-width="${f2(0.3 * U)}" transform="translate(0 0)"/></g>`);

    big: ['#c9b8ab', '#e6dac4', '#b9a07e', '#d3bfa4'],
    small: ['#b39670', '#a98f6d', '#bca37f'],
    church: ['#c98a6a'],
  };

    const high = roads.features.filter(f => f.properties.name === 'North High Street' && f.properties.class === 'primary');
    const pts = [];
    for (const f of high) for (const line of (f.geometry.type === 'LineString' ? [f.geometry.coordinates] : f.geometry.coordinates)) for (const c of line) if (c[1] > 39.9766 && c[1] < 39.9893) pts.push(c);

    }
    out.push(`<g style="mix-blend-mode:multiply" filter="url(#inkline)"><path d="${arches}" stroke="${C.rustDeep}" stroke-width="${f2(0.95 * U)}" fill="none" stroke-linecap="round"/></g>
      <g fill="#f3c974" stroke="${C.rustDeep}" stroke-width="${f2(0.12 * U)}">${lamps}</g>`);
  }
  // the street trees, stamped in their October colours
  const tcols = [C.ochre, C.rust, '#c9a24e', '#d4ae5a', C.sage, '#c08a3e', C.ochre, '#b98a3a', '#d9b968', C.haw];
  const list = [];
  const placed = [];
  trees.features.forEach((f, i) => {
    const xy = proj(f.geometry.coordinates);
    if (!xy || xy[0] < -30 || xy[0] > W + 30 || xy[1] < -30 || xy[1] > H + 30) return;
    if (placed.some(p => Math.abs(p[0] - xy[0]) < 15 && Math.abs(p[1] - xy[1]) < 15)) return;
    placed.push(xy);
    list.push(Sprites.put('crown', xy[0], xy[1], U * 0.95, { r: 2.5 + rand() * 1.1, fill: tcols[Math.floor(rand() * tcols.length)], ph: rand() * 6 }));
  });
  out.push(Sprites.stamps(list));
  return out.join('\n');
}
function shortnorthLabels(L, proj) {
  const at = (lon, lat) => proj([lon, lat]);
  const items = [];
  const put = (lon, lat, t, o) => { const [x, y] = at(lon, lat); items.push([x, y, t, o]); };
  put(-83.00445, 39.9905, 'HIGH STREET', { size: 9, track: 0.34, rotate: -84 });
  put(-83.0085, 39.9862, 'VICTORIAN VILLAGE', { size: 7.6, track: 0.3, fill: '#4a3c28' });
  put(-83.0012, 39.9800, 'ITALIAN VILLAGE', { size: 7.6, track: 0.3, fill: '#4a3c28' });
  put(-83.0098, 39.9772, 'Goodale Park', { size: 9, italic: true, track: 0.06, fill: '#33402a' });
  return PA.letterpress(items);
}

// ---------- drawing ----------
async function draw(level, layer, magnify, mx, my) {
  const L = LEVELS[level - 1], proj = L.proj(), rand = PA.rng(1000 + level * 77);
  PA.setView(magnify, mx, my);
  await Promise.all([document.fonts.load(`40px CG`), document.fonts.load(`italic 40px CG`), document.fonts.load(`40px CSC`)]);
  let body = '';
  const sp = (SPRITES[L.id] || []).find(s => s.name === layer);
  if (layer === 'ground') body = await GROUNDS[L.id](L, proj, rand);
  // a pass plate goes without names: they would only swell as the camera dives through
  else if (layer === 'labels') body = magnify !== 1 ? '' : PA.defs() + await LABELS[L.id](L, proj);
  else if (sp) body = await SPRITE_ART[`${L.id}/${sp.name}`](sp);
  else throw new Error('no layer ' + layer);
  // a pass plate: the level magnified about (mx, my), drawn here so the filters only work where it shows
  // (the definitions stay outside the magnifying group: a filter's feImage would otherwise draw its
  // noise through that transform twice)
  if (magnify !== 1) {
    const defs = [];
    body = body.replace(/<defs>[\s\S]*?<\/defs>/g, m => { defs.push(m); return ''; });
    body = defs.join('') + `<g transform="translate(${f2(W / 2 - mx * magnify)} ${f2(H / 2 - my * magnify)}) scale(${magnify})">${body}</g>`;
  }
  document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">${body}</svg>`;
}

const GROUNDS = { world: worldGround, america: americaGround, ohio: ohioGround, columbus: columbusGround, shortnorth: shortnorthGround };
const LABELS = { world: worldLabels, america: americaLabels, ohio: ohioLabels, columbus: columbusLabels, shortnorth: shortnorthLabels };
const SPRITE_ART = {
  'world/arm': () => worldArm(),
  'world/ship': sp => PA.defs() + Sprites.ptDefs() + Sprites.place(Sprites.ship(), sp.at[0], sp.at[1], sp.s, 0, 0),
  'america/geese': sp => Sprites.ptDefs() + Sprites.place(Sprites.geese(), sp.at[0], sp.at[1], sp.s, 0, 0),
  'america/serpent': sp => Sprites.ptDefs() + Sprites.place(Sprites.serpent('a'), sp.at[0], sp.at[1], sp.s, ...sp.center),
  'shortnorth/maple': sp => Sprites.ptDefs() + `<g transform="translate(${sp.at[0]} ${sp.at[1]}) rotate(${sp.rot}) scale(${sp.s})">${Sprites.mapleLeaf()}</g>`,
  'shortnorth/oak': sp => Sprites.ptDefs() + `<g transform="translate(${sp.at[0]} ${sp.at[1]}) rotate(${sp.rot}) scale(${sp.s})">${Sprites.oakLeaf()}</g>`,
  'columbus/heron': sp => Sprites.ptDefs() + Sprites.place(Sprites.heron(), sp.at[0], sp.at[1], sp.s, 0, 0),
  'ohio/cardinal': sp => Sprites.ptDefs() + Sprites.place(Sprites.cardinal(), sp.at[0], sp.at[1], sp.s, 0, 0),
};

const { level, layer, magnify, cx: mx, cy: my } = Kit.params();
window.platesMagnifies = true;
if (layer !== 'none') addEventListener('DOMContentLoaded', () =>
  draw(level, layer, magnify, mx, my).then(() => requestAnimationFrame(() => { window.platesReady = true; }), e => { window.platesReady = 'failed: ' + e.message; }));
</script>
